<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUS SUB</title>
<meta name="description" content="A substitute driver, a broken-down school bus, a hot afternoon and a five-minute deadline. Keyboard driving game for the desktop browser.">
<meta property="og:title" content="BUS SUB">
<meta property="og:description" content="A substitute driver, a broken-down school bus, a hot afternoon and a five-minute deadline.">
<meta property="og:image" content="https://justbost.com/bus-sub/screenshot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Overpass+Mono:wght@400;700&family=Press+Start+2P&family=Special+Elite&display=swap">
<style>
  :root{
    --sky-top:#3f9ad2; --sky-mid:#8fcbe8; --sky-bot:#cfe7f2;
    --hill-far:#7fa36c; --hill-near:#5f8a52;
    --grass-l:#548743; --grass-d:#4b7c3b;
    --road-l:#6a6f77; --road-d:#63686f;
    --rumble-l:#eceef0; --rumble-d:#bf3128;
    --lane:#eceef0; --yellow:#e8bf3c; --fog:#cfe7f2;
    --px:"Press Start 2P","Overpass Mono",monospace;
    --bus:#f4b301; --bus-mid:#d29700; --bus-dark:#8a6400;
    --body:#e3e0d6; --body-mid:#c9c5b8; --body-dark:#a9a496; --body-text:#5c3a91;
    --ink:#101317; --panel:#171a20; --panel-2:#20242c; --line:#333a45;
    --text:#e9ebef; --muted:#98a1b0; --accent:#f4b301; --warn:#e4573d; --ok:#7fc45a;
    --water:#4aa8d8; --bladder:#d8a23c; --sign:#1c6b2e;
    --font:"Overpass","Helvetica Neue",Arial,sans-serif;
    --mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --pw:min(330px,88vw);
  }
  html,body{height:100%;}
  body{margin:0; background:var(--ink); color:var(--text); font-family:var(--font);
       overflow:hidden; -webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  #stage{position:relative; width:100%; height:100%; overflow:hidden; background:var(--sky-bot);}
  #road{display:block; width:100%; height:100%;}

  #prog{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:min(560px,52vw); height:18px; border-radius:9px;
    background:rgba(16,19,23,.8); border:2px solid rgba(255,255,255,.18);
    pointer-events:none; overflow:visible;
  }
  #prog-fill{
    position:absolute; left:2px; top:2px; bottom:2px; width:0%;
    border-radius:7px; background:linear-gradient(90deg, rgba(244,179,1,.45), rgba(244,179,1,.85));
  }
  /* side view: long body, a row of windows, two wheels under it */
  #prog-bus{
    position:absolute; top:-13px; left:0; width:60px; height:26px; margin-left:-30px;
    background:var(--body); border:2px solid var(--body-dark);
    border-radius:4px 9px 4px 4px; box-shadow:0 3px 9px rgba(0,0,0,.55);
  }
  #prog-bus::before{
    content:""; position:absolute; left:5px; right:12px; top:4px; height:8px;
    background:repeating-linear-gradient(90deg,#2b3a44 0 7px,transparent 7px 10px);
    border-radius:1px;
  }
  #prog-bus::after{
    content:""; position:absolute; left:8px; width:8px; height:8px; bottom:-6px;
    background:#18191c; border-radius:50%;
    box-shadow:30px 0 0 0 #18191c;
  }

  #clock{
    position:absolute; left:50%; transform:translateX(-50%);
    top:calc(12px + env(safe-area-inset-top,0px));
    background:rgba(16,19,23,.86); border:2px solid rgba(255,255,255,.14);
    border-radius:7px; padding:7px 24px 10px; text-align:center; pointer-events:none;
  }
  #clock b{
    display:block; font-family:var(--mono); font-weight:700; font-size:45px; line-height:1;
    letter-spacing:.06em; color:var(--accent); font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(244,179,1,.35);
  }
  #clock i{
    display:block; font-style:normal; font-size:12px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted); font-weight:700; margin-top:3px;
  }
  #clock.warn b{ color:var(--warn); text-shadow:0 0 14px rgba(228,87,61,.45); }

  #info{
    position:absolute; right:16px; top:calc(16px + env(safe-area-inset-top,0px));
    display:flex; flex-direction:column; gap:6px; align-items:flex-end; pointer-events:none;
  }
  #wild{ font-size:19px; padding:6px 15px 8px; }
  #wild span{ font-size:14px; margin-top:5px; }
  #wild[hidden]{ display:none !important; }
  .gauge{background:rgba(16,19,23,.82); border:2px solid rgba(255,255,255,.14);
         border-radius:6px; padding:9px 15px 10px; min-width:118px;}
  .gauge .k{font-size:13px; letter-spacing:.14em; text-transform:uppercase;
            color:var(--muted); font-weight:700; line-height:1;}
  .gauge .v{font-family:var(--mono); font-weight:700; font-size:30px; line-height:1.18;
            font-variant-numeric:tabular-nums; color:var(--text);}
  .gauge .v small{font-size:16px; color:var(--muted); font-weight:400; margin-left:2px;}
  .gauge.warn .v{color:var(--warn);} .gauge.good .v{color:var(--ok);}
  .gauge.wide{min-width:208px;}
  .gauge .v.word{font-size:19px; letter-spacing:.06em; padding-top:4px;}
  .gauge .bar{margin-top:7px; height:6px; border-radius:2px; overflow:hidden; background:rgba(255,255,255,.14);}
  .gauge .bar i{display:block; height:100%; width:0%; background:var(--ok);}
  .gauge.stir .bar i{background:var(--accent);} .gauge.warn .bar i{background:var(--warn);}

  #topstack{
    position:absolute; left:50%; top:calc(122px + env(safe-area-inset-top,0px));
    transform:translateX(-50%); display:flex; flex-direction:column; gap:8px;
    align-items:center; pointer-events:none; width:max-content; max-width:94vw;
  }
  #fork{ display:flex; gap:14px; pointer-events:none; }
  #fork[hidden]{display:none !important;}
  .fk{
    background:rgba(16,19,23,.88); border:3px solid rgba(255,255,255,.2);
    border-radius:5px; padding:9px 16px; text-align:center; min-width:168px;
    color:var(--muted); transition:none;
  }
  .fk .a{font-size:13px; font-weight:900; letter-spacing:.2em; display:block;}
  .fk .z{font-size:17px; font-weight:800; letter-spacing:.03em; color:var(--text); margin-top:3px; display:block;}
  .fk.on{ border-color:var(--accent); background:rgba(58,44,8,.92); color:var(--accent); }
  .fk.off{ opacity:.3; }
  .fk.on .z{ color:#fff; }

  #advice{
    display:flex; flex-direction:column; gap:5px; align-items:center;
    pointer-events:none; max-width:min(440px,88vw);
  }
  .adv{
    font-size:24px; font-weight:900; letter-spacing:.14em; text-transform:uppercase;
    color:#fff3cf; background:rgba(16,19,23,.88);
    border:3px solid rgba(244,179,1,.5); border-radius:4px;
    padding:8px 21px 10px; text-align:center; line-height:1.2; white-space:nowrap;
  }
  .adv.hot{ color:#fff; background:rgba(150,38,24,.92); border-color:rgba(255,120,96,.7); }
  .adv em{ font-style:normal; display:block; }
  .adv span{ display:flex; align-items:center; justify-content:center; gap:.34em;
             font-size:17px; margin-top:7px; letter-spacing:.1em; }

  .chip{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.04em;
        background:rgba(16,19,23,.82); border:1px solid var(--line); color:var(--muted);
        border-radius:4px; padding:5px 11px;}
  .chip.bad{color:var(--warn); border-color:#5a2d26;}
  .chip[hidden]{display:none !important;}

  /* The thirst warning sits on top of the instruments it is about, and
     swims the same way the windscreen does while you are lightheaded. */
  #thirsty{
    position:absolute; right:34px; bottom:392px; pointer-events:none; z-index:5;
    font-size:21px; font-weight:900; letter-spacing:.08em; text-transform:uppercase;
    color:#fff; background:rgba(150,38,24,.94);
    border:3px solid rgba(255,120,96,.8); border-radius:4px;
    padding:8px 18px; text-align:center; line-height:1.2; white-space:nowrap;
    transform-origin:50% 50%;
  }
  #thirsty em{ font-style:normal; display:block; }
  #thirsty span{ display:flex; align-items:center; justify-content:center; gap:.4em;
                 font-size:17px; margin-top:7px; letter-spacing:.1em; }
  #thirsty[hidden]{display:none !important;}

  /* Causes of rowdiness, shown beside the gauge they are moving. */
  #rowdyrow{ display:flex; gap:10px; align-items:center; }
  #ricons{ display:flex; gap:8px; align-items:center; }
  .ricon{ width:54px; height:54px; background:rgba(16,19,23,.88);
          border:3px solid rgba(255,255,255,.18); border-radius:7px;
          display:flex; align-items:center; justify-content:center; }
  .ricon[hidden]{display:none !important;}
  .ricon.horn{ border-color:#f4b301; background:rgba(58,44,8,.94); }
  .ricon.yield, .ricon.fanx{ border-color:#e4573d; background:rgba(62,22,16,.94); }
  .ricon svg{ width:36px; height:36px; display:block; }

  #card{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        padding:24px 16px; pointer-events:none; z-index:6;}
  #card[hidden]{display:none !important;}
  #card.c-title{ padding:0; }
  .sheet{pointer-events:auto; width:min(470px,100%); background:rgba(16,19,23,.94);
         border:2px solid rgba(255,255,255,.16); border-radius:6px; padding:20px 22px 22px;
         box-shadow:0 18px 50px rgba(0,0,0,.45); max-height:100%; overflow-y:auto;}
  .sheet .eyebrow{font-size:10px; letter-spacing:.2em; text-transform:uppercase;
                  color:var(--accent); font-weight:800; margin-bottom:6px;}
  .sheet h1{font-size:26px; line-height:1.08; margin:0 0 8px; font-weight:900;
            letter-spacing:-.015em; text-wrap:balance;}
  .sheet > p{margin:0 0 14px; color:var(--muted); font-size:13.5px; line-height:1.55;}
  .keys{display:grid; grid-template-columns:auto 1fr; gap:6px 12px; margin:0 0 16px; font-size:13px;}
  .keys dt{font-family:var(--mono); font-weight:700; color:var(--accent); white-space:nowrap;}
  .keys dd{margin:0; color:var(--muted);}

  .sheet.paper{background:#e7dfc8; color:#2b2419; border:1px solid #a89b7b;
    padding:0; overflow:hidden; position:relative;
    box-shadow:0 20px 56px rgba(0,0,0,.6), inset 0 0 70px rgba(120,95,50,.13);}
  .rc{position:relative; padding:20px 22px 18px; font-family:"Special Elite","Courier New",monospace;}
  .rc::before{content:""; position:absolute; left:-34px; bottom:74px; width:136px; height:136px;
    border:9px solid rgba(118,82,34,.10); border-radius:50%; pointer-events:none;}
  .rc::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(60% 40% at 14% 6%, rgba(150,120,60,.14), transparent 70%),
               radial-gradient(40% 30% at 92% 88%, rgba(110,80,30,.12), transparent 70%);}
  .rc-hd{border-bottom:2px solid #2b2419; padding-bottom:9px; margin-bottom:11px;}
  .rc-ttl{font-size:24px; line-height:1.1;}
  .rc-meta{display:flex; gap:20px; flex-wrap:wrap; margin-bottom:14px;}
  .rc-meta div{font-size:15px;}
  .rc-meta span{color:#6b5f42; letter-spacing:.09em; text-transform:uppercase; font-size:12px;
                display:block; margin-bottom:2px;}
  .rc-meta b{font-weight:400; border-bottom:1px solid #9a8d6d; padding:0 14px 1px 0; display:block;}
  .rc-tbl{width:100%; border-collapse:collapse; font-size:17px; margin-bottom:14px;}
  .rc-tbl th{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#6b5f42;
             text-align:left; font-weight:400; padding-bottom:5px; border-bottom:1px solid #2b2419;}
  .rc-tbl th.g, .rc-tbl th.n{text-align:right;}
  .rc-tbl td{padding:7px 0 6px; border-bottom:1px dashed #b3a687; vertical-align:baseline;}
  .rc-tbl td.c small{display:block; font-size:13px; color:#6b5f42; margin-top:3px;}
  .rc-tbl td.g{text-align:right; font-size:24px; width:56px;}
  .rc-tbl td.n{text-align:right; width:84px; font-family:var(--mono); font-size:15px;
               font-variant-numeric:tabular-nums;}
  .rc-tbl tr.neg td.g, .rc-tbl tr.neg td.n{color:#9c2c1f;}
  .rc-bot{display:flex; align-items:center; justify-content:space-between; gap:14px;
          border-top:2px solid #2b2419; padding-top:11px; flex-wrap:wrap;}
  .rc-tot span{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#6b5f42; display:block;}
  .rc-tot b{font-family:var(--mono); font-size:30px; font-weight:700; line-height:1.05;
            font-variant-numeric:tabular-nums;}
  .rc-stamp{font-size:18px; letter-spacing:.1em; color:#9c2c1f; text-transform:uppercase;
    border:3px double #9c2c1f; border-radius:3px; padding:6px 13px;
    transform:rotate(-7deg); opacity:.82; text-align:center; max-width:60%;}
  .rc-rem{margin-top:14px; font-size:15px; line-height:1.5;}
  .rc-rem span{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#6b5f42;
               display:block; margin-bottom:4px;}
  .rc-rem p{margin:0; color:#3a3225; border-bottom:1px solid #b3a687; padding-bottom:9px;}
  .rc-act{margin-top:16px;}
  .rc-act button{background:#2b2419; color:#e7dfc8; border-color:#000; font-size:16px;
                 font-family:"Special Elite","Courier New",monospace; letter-spacing:.1em;}

  button{font-family:var(--font); font-weight:800; font-size:13px; letter-spacing:.06em;
         text-transform:uppercase; cursor:pointer; border-radius:4px;
         border:2px solid var(--bus-dark); background:var(--bus); color:#221900;
         padding:9px 18px; transition:filter .12s;}
  button:hover{filter:brightness(1.08);}
  button:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  button.ghost{background:rgba(16,19,23,.8); color:var(--text); border-color:var(--line);}

  /* ---- title screen ----
     BUS, then the same word mirrored: SUB with its S and B facing the wrong
     way, which is what a bus sub is. Pixel type, hard offset shadows, and the
     road's centre line running up between the two words. */
  .sheet.title{
    width:100%; height:100%; max-height:100%; border:0; border-radius:0; padding:0;
    background:transparent; box-shadow:none; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px,3.4vh,40px); position:relative; font-family:var(--px);
  }
  /* No panel: the title sits straight over the bus waiting to pull out, and
     hitting space drops it. Everything carries its own hard pixel outline so
     it reads against sky, grass or tarmac without a box behind it. */
  .sheet.title > *{ position:relative; z-index:1; }
  .tt{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,2.2vw,30px);
       line-height:1; padding:0 12px; }
  .tt b{ font-family:var(--px); font-weight:400; font-size:clamp(32px,10.4vw,112px);
         letter-spacing:.02em; display:inline-block; }
  .tt .m{ display:inline-block; transform:scaleX(-1); }
  .tt .bus{ color:#ffc21c;
    text-shadow:
      3px 0 0 #0d1526, -3px 0 0 #0d1526, 0 3px 0 #0d1526, 0 -3px 0 #0d1526,
      3px 3px 0 #0d1526, -3px 3px 0 #0d1526, 3px -3px 0 #0d1526, -3px -3px 0 #0d1526,
      8px 9px 0 #e2621a, 11px 12px 0 #0d1526; }
  .tt .sub{ color:#fff;
    text-shadow:
      3px 0 0 #0d1526, -3px 0 0 #0d1526, 0 3px 0 #0d1526, 0 -3px 0 #0d1526,
      3px 3px 0 #0d1526, -3px 3px 0 #0d1526, 3px -3px 0 #0d1526, -3px -3px 0 #0d1526,
      8px 9px 0 #9b6fe0, 11px 12px 0 #0d1526; }
  /* scaleX(-1) flips the drop shadow too - negate it so every letter's shadow
     still falls to the lower right, as it does in the reference */
  .tt .sub .m{
    text-shadow:
      3px 0 0 #0d1526, -3px 0 0 #0d1526, 0 3px 0 #0d1526, 0 -3px 0 #0d1526,
      3px 3px 0 #0d1526, -3px 3px 0 #0d1526, 3px -3px 0 #0d1526, -3px -3px 0 #0d1526,
      -8px 9px 0 #9b6fe0, -11px 12px 0 #0d1526; }
  .tt i{                                       /* the road's centre line */
    width:clamp(8px,1.3vw,16px); align-self:stretch; margin:.1em 0;
    background:repeating-linear-gradient(180deg,#ffd23f 0 16px, transparent 16px 30px);
    filter:drop-shadow(3px 3px 0 #0d1526); }
  .tkeys{ display:grid; gap:clamp(9px,1.7vh,15px); justify-items:center;
          font-family:var(--px); font-size:clamp(9px,1.5vw,15px); color:#fff;
          line-height:1.5; text-align:center;
          text-shadow:2px 0 0 #0d1526, -2px 0 0 #0d1526, 0 2px 0 #0d1526, 0 -2px 0 #0d1526,
                      2px 2px 0 #0d1526, -2px 2px 0 #0d1526, 2px -2px 0 #0d1526, -2px -2px 0 #0d1526,
                      4px 5px 0 rgba(13,21,38,.55); }
  .tkeys span{ display:inline-flex; align-items:center; gap:.7em; flex-wrap:wrap;
               justify-content:center; }
  /* One keycap, used on the title screen, in the advisories and anywhere else
     a key is named. Square by default so the four arrows are all the same
     size - sized by the box, not by how wide the glyph happens to be. */
  .kc{ display:inline-grid; place-items:center; width:2.1em; height:2.1em; padding:0;
       color:#20140a; background:#ffd23f; border:0; border-radius:2px;
       font-family:var(--px); font-weight:400; font-size:.92em; line-height:1;
       box-shadow:0 4px 0 #b8801a, 0 4px 0 2px #0d1526, 0 0 0 2px #0d1526;
       transform:translateY(-2px); }
  .kc.w{ width:auto; height:2.1em; padding:0 .7em; }
  button.tgo{ font-family:var(--px); font-size:clamp(10px,1.7vw,17px); letter-spacing:.04em;
       text-transform:none; color:#20140a; background:#7ed957; border:0; border-radius:3px;
       padding:1em 1.5em; box-shadow:0 6px 0 #3f8a2b, 0 6px 0 3px #0d1526, 0 0 0 3px #0d1526;
       animation:tpulse 1.15s steps(2,end) infinite; }
  button.tgo:hover{ filter:brightness(1.06); }
  button.tgo:active{ transform:translateY(3px); box-shadow:0 3px 0 #3f8a2b, 0 3px 0 3px #0d1526, 0 0 0 3px #0d1526; }
  @keyframes tpulse{ 0%,60%{ filter:none; } 61%,100%{ filter:brightness(1.14); } }
  @media (prefers-reduced-motion:reduce){ button.tgo{ animation:none; } }

  #clock{cursor:default; pointer-events:auto;}
  #panel{position:absolute; top:0; right:0; bottom:0; width:var(--pw);
         background:var(--panel); border-left:2px solid var(--line);
         padding:16px 18px; padding-top:calc(16px + env(safe-area-inset-top,0px));
         padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));
         overflow-y:auto; z-index:8; transform:translateX(102%); transition:transform .22s ease;
         box-shadow:-14px 0 40px rgba(0,0,0,.4);}
  #panel.open{transform:translateX(0);}
  .phead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:3px;}
  #panel h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase;
            color:var(--accent); font-weight:800; margin:0;}
  #panelclose{border:none; background:transparent; color:var(--muted); font-size:20px;
              line-height:1; padding:0 2px; margin:-4px -2px 0 0; font-weight:400;}
  #panelclose:hover{color:var(--text); filter:none;}
  #panel .note{font-size:11.5px; color:var(--muted); line-height:1.5; margin:0 0 16px;}
  .grp{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
       font-weight:800; margin:18px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line);}
  .grp:first-of-type{margin-top:0;}
  .row{margin-bottom:11px;}
  .row .lab{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px;}
  .row .lab span{font-size:12px; color:var(--text);}
  .row .lab b{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--accent);
              font-variant-numeric:tabular-nums;}
  .row input[type=range]{width:100%; accent-color:var(--accent); height:18px; cursor:pointer;}
  .row input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .row.rebuild .lab span::after{content:"restarts"; font-size:8.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); border:1px solid var(--line);
    border-radius:2px; padding:1px 4px; margin-left:6px; vertical-align:1px;}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px;}
  .btns button{flex:1 1 auto; padding:9px 10px; font-size:11px;}
  #dump{width:100%; margin-top:12px; height:120px; resize:vertical; background:var(--panel-2);
        color:var(--text); border:1px solid var(--line); border-radius:4px;
        font-family:var(--mono); font-size:11px; padding:8px; line-height:1.45;}
  #dump[hidden]{display:none !important;}

  @media (max-width:560px){
    .gauge{min-width:66px; padding:5px 8px 6px;} .gauge .v{font-size:17px;}
    #bodypanel{min-width:0; width:100%;} #lanewrap{width:100%;} #lanebar{width:100%;}
    #hud{padding-right:16px;}
  }

var P = {};
PARAMS.forEach(function(p){ if(p.k) P[p.k] = p.d; });
var STORE = "route9.tuning.v2";
try{
  var saved = JSON.parse(localStorage.getItem(STORE) || "null");
  if(saved) PARAMS.forEach(function(p){
    if(p.k && typeof saved[p.k] === "number" && isFinite(saved[p.k]))
      P[p.k] = Math.max(p.min, Math.min(p.max, saved[p.k]));
  });
}catch(e){}
/* The slider's ceiling used to be 100, so a value saved from an earlier
   session could have wooziness starting at any hydration at all. The ceiling
   is 10 now and anything stored above it is dragged back down on load. */
P.dimStart = clamp(P.dimStart, 2, 10);
function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(P)); }catch(e){} }

function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a + (b-a)*t; }

/* ---------------- canvas ---------------- */
var cv = document.getElementById("road"), ctx = cv.getContext("2d"), W = 0, H = 0;
function resize(){
  var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
function scaleK(){ return Math.min(H/2, W/2.6); }
function camDepth(){ return 1 / Math.tan((P.fov/2) * Math.PI/180); }
function playerZ(){ return P.camDist; }
function busZ(){ return position + playerZ(); }
function maxSpeed(){ return P.maxSpeedMph * upm(); }

/* Lane centre in world units. On a road with oncoming traffic the upper half
   of the lanes is your direction. */
function zoneHalfW(Z){ return (Z.w || Z.lanes) * LANE_W / 2; }
function laneX(i, lanes){ return (i - (lanes - 1) / 2) * LANE_W; }
function firstOwnLane(seg){ return seg.onc ? Math.ceil(seg.lanes / 2) : 0; }
/* Lanes a car of this direction is allowed to use. Nothing crosses the
   centreline: same-direction traffic stays on its own half, oncoming stays on
   its half, and a car that finds itself in a zone with no lane for its
   direction is recycled rather than driven into the facing stream. */
/* The drivable right-hand edge: the road, plus the exit apron where there is
   one. The exit is always on the right, so taking it never means crossing
   oncoming traffic. */
/* A junction is two roads. The exit runs alongside the main road, and in the
   last stretch before the split a wedge of grass - the gore - opens between
   them, so the exit visibly leaves. rightEdge is the OUTER edge of everything
   drivable; onSurface is the question that actually matters, because the gore
   in the middle is grass. */
function rightEdge(seg){
  var w = seg.exitW || 0;
  return seg.halfW + (w > 0 ? (seg.exitGap || 0) + w : 0);
}
function exitLo(seg){ return seg.halfW + (seg.exitGap || 0); }
function onSurface(seg, x){
  if(x >= -seg.halfW && x <= seg.halfW) return true;
  var w = seg.exitW || 0;
  if(w <= 0) return false;
  var lo = exitLo(seg);
  return x >= lo - 60 && x <= lo + w;
}
function laneRange(seg, dir){
  var first = firstOwnLane(seg);
  return dir < 0 ? { lo:0, hi:first - 1 } : { lo:first, hi:seg.lanes - 1 };
}

/* ---------------- road ---------------- */
var segments = [], finishZ = 0, lights = [], peds = [], crossings = [], zoneSpans = [];

function lastY(){ return segments.length === 0 ? 0 : segments[segments.length-1].p2.world.y; }
function addSegment(curve, y, zk){
  var n = segments.length, Z = ZONES[zk];
  segments.push({
    index:n, zone:zk, lanes:Z.lanes, onc:Z.onc, halfW:zoneHalfW(Z),
    p1:{world:{y:lastY(), z:n*SEG_LEN}, camera:{}, screen:{}},
    p2:{world:{y:y, z:(n+1)*SEG_LEN}, camera:{}, screen:{}},
    curve:curve, sprites:[], cars:[], exitW:0, exitGap:0, dark:(Math.floor(n/RUMBLE_LEN)%2 === 1),
    finish:false, clip:0, fog:1
  });
}
function easeIn(a,b,p){ return a + (b-a)*p*p; }
function easeInOut(a,b,p){ return a + (b-a)*((-Math.cos(p*Math.PI)/2)+0.5); }
function addRoad(enter, hold, leave, curve, dy, zk){
  var y0 = lastY(), y1 = y0 + dy, n = enter + hold + leave, i;
  for(i=0;i<enter;i++) addSegment(easeIn(0,curve,i/enter), easeInOut(y0,y1,i/n), zk);
  for(i=0;i<hold;i++)  addSegment(curve,                     easeInOut(y0,y1,(enter+i)/n), zk);
  for(i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave), easeInOut(y0,y1,(enter+hold+i)/n), zk);
}

var routePlan = [], zoneTarget = [], forkAt = -1, forkOpts = null, forkLocked = false;
var MID_POOL = ["rural","town","hwy3","hwy4","hwy5","ramp"];

function buildZone(zk, want){
  var Z = ZONES[zk], from = segments.length;
  while(segments.length - from < want){
    var need = want - (segments.length - from);
    var L = clamp(Math.floor(need / 3), 7, 40);
    var curve = (Math.random()*2 - 1) * 4.2 * Z.curve * P.curveScale;
    var hill  = (Math.random()*2 - 1) * 46 * Z.hill * P.hillScale;
    if(Math.random() < 0.26) curve = 0;
    addRoad(L, L, L, curve, hill, zk);
  }
  zoneSpans.push({ zone:zk, from:from, to:segments.length });
}
function markFinish(){
  var fi = segments.length - 40;
  for(var f=fi; f<fi+6 && f<segments.length; f++){ segments[f].finish = true; segments[f].curve = 0; }
  finishZ = fi * SEG_LEN;
}
function signZones(){
  for(var zi=0; zi<zoneSpans.length; zi++){
    var sIdx = zoneSpans[zi].from + 14, sg = segments[sIdx];
    if(sg && !sg.__signed){
      sg.__signed = true;
      sg.sprites.push({t:"limit", x: zoneHalfW(ZONES[sg.zone]) + 900, n: ZONES[sg.zone].limit});
    }
  }
}

function buildRoad(){
  segments = []; lights = []; peds = []; crossings = []; holes = []; zoneSpans = [];
  forkAt = -1; forkOpts = null; forkLocked = false; forkDoneAt = -1; carveEnd = -1;
  routePlan = makeSequence();
  var totalW = 0, i;
  for(i=0;i<routePlan.length;i++) totalW += ZONES[routePlan[i]].len;
  var totalSeg = Math.max(600, Math.round(P.routeMiles * upmile() / SEG_LEN));
  zoneTarget = [];
  for(i=0;i<routePlan.length;i++)
    zoneTarget.push(Math.max(24, Math.round(totalSeg * ZONES[routePlan[i]].len / totalW)));
  for(i=0;i<routePlan.length;i++) buildZone(routePlan[i], zoneTarget[i]);
  markFinish();
  smoothWidths();
  signZones();
  placeHazards(0);
  addSprites(0);
}

/* Swapping a zone rebuilds only the road past that boundary. The boundary is
   locked well beyond the draw distance, so nothing the player can see changes
   under them. Everything already behind the cut keeps its state. */
function rebuildFrom(zi){
  var cut = zoneSpans[zi].from;
  segments.length = cut;
  zoneSpans.length = zi;
  for(var i=zi;i<routePlan.length;i++) buildZone(routePlan[i], zoneTarget[i]);
  markFinish();
  smoothWidths();
  signZones();
  function keep(arr){ return arr.filter(function(o){ return o.idx < cut; }); }
  var holesKept = keep(holes).length;
  lights = keep(lights); peds = keep(peds); crossings = keep(crossings); holes = keep(holes);
  placeHazards(zi, Math.max(0, Math.round(P.potholeCount) - holesKept));
  addSprites(cut);
  for(var c=0;c<cars.length;c++) if(cars[c].z > cut*SEG_LEN) placeCar(cars[c], true);
}

/* A road cannot gain two lanes in one segment. Blend half-width across each
   zone boundary so the road visibly opens out and narrows down. */
function smoothWidths(){
  var BLEND = 26, i, j;
  for(i=1;i<zoneSpans.length;i++){
    var b = zoneSpans[i].from;
    var wa = segments[b-1] ? zoneHalfW(ZONES[segments[b-1].zone]) : segments[b].halfW;
    var wb = zoneHalfW(ZONES[segments[b].zone]);
    for(j=-BLEND;j<=BLEND;j++){
      var s = segments[b+j];
      if(!s) continue;
      var t = (j + BLEND) / (BLEND*2);
      s.halfW = easeInOut(wa, wb, t);
    }
  }
}

function placePotholes(fromZi, total){
  total = Math.round(total);
  if(total <= 0) return;
  var weights = [], sum = 0, i;
  for(i=fromZi;i<zoneSpans.length;i++){
    var w = (zoneSpans[i].to - zoneSpans[i].from) * (ZONES[zoneSpans[i].zone].holeW || 0.6);
    weights.push(w); sum += w;
  }
  var placed = 0;
  for(i=fromZi;i<zoneSpans.length && placed < total;i++){
    var sp = zoneSpans[i];
    var n = Math.round(total * weights[i - fromZi] / sum);
    for(var j=0;j<n && placed < total;j++){
      var span = sp.to - sp.from;
      if(span < 40) continue;
      var hi = sp.from + 16 + Math.floor(Math.random() * (span - 32));
      var seg0 = segments[hi];
      if(!seg0) continue;
      holes.push({ z: hi*SEG_LEN, idx: hi,
                   x: (Math.random()*2 - 1) * Math.max(200, seg0.halfW - 500),
                   r: 330 + Math.random()*250, hit:false });
      placed++;
    }
  }
}
function placeHazards(fromZi, holeBudget){
  var i, j;
  /* A fixed budget for the whole route, shared out by how rough each zone is.
     A pothole should be an event you remember, not road texture. */
  placePotholes(fromZi, holeBudget === undefined ? P.potholeCount : holeBudget);
  for(i=fromZi;i<zoneSpans.length;i++){
    var sp = zoneSpans[i], Z = ZONES[sp.zone], span = sp.to - sp.from;
    /* level crossings - the county road's own kind of unskippable stop */
    if(Z.trains){
      var nX = Math.max(1, Math.round(span / 420));
      for(j=0;j<nX;j++){
        var xi = sp.from + Math.round(span * (j + 0.55) / (nX + 0.1));
        if(xi > sp.from + 30 && xi < sp.to - 30)
          crossings.push({ z: xi*SEG_LEN, idx: xi, phase: Math.random()*40,
                           state:"clear", trainX:0, ran:false });
      }
    }
    /* traffic lights */
    if(Z.lights){
      var nL = Math.max(1, Math.round(span / 150));
      for(j=0;j<nL;j++){
        var li = sp.from + Math.round(span * (j + 0.6) / (nL + 0.2));
        if(li > sp.from + 20 && li < sp.to - 20)
          lights.push({ z: li*SEG_LEN, idx: li, phase: Math.random()*P.lightCycle*2,
                        state:"green", ran:false });
      }
    }
    /* pedestrians */
    if(Z.peds > 0){
      var nP = Math.round(span / 46 * Z.peds * P.pedDensity);
      for(j=0;j<nP;j++){
        var pi = sp.from + 12 + Math.floor(Math.random() * Math.max(1, span - 24));
        var dir = Math.random() < 0.5 ? 1 : -1;
        var hw = segments[pi] ? segments[pi].halfW : LANE_W;
        peds.push({ z: pi*SEG_LEN, x: -dir * (hw + 700), dir: dir,
                    speed: 240 + Math.random()*170, near:false, done:false, honked:false, scram:0, dive:0, wait:0,
                    phase: Math.random()*6.283 });
      }
    }
  }
}
function addSprites(fromSeg){
  for(var n=Math.max(10, fromSeg||0); n<segments.length-40; n++){
    if(segments[n].__dressed) continue;
    segments[n].__dressed = true;
    var s = segments[n], Z = ZONES[s.zone];
    var edge = s.halfW / LANE_W * 1.0;
    if(n % 16 === 0) s.sprites.push({t:"pole", x: s.halfW + 900});
    if(Math.random() < 0.10) s.sprites.push({t:"tree", x: -(s.halfW + 900 + Math.random()*3400)});
    if(Math.random() < 0.10) s.sprites.push({t:"tree", x:  (s.halfW + 900 + Math.random()*3400)});
    if(n % 150 === 0)        s.sprites.push({t:"sign", x: s.halfW + 1100});
    if(n % 64 === 0)         s.sprites.push({t:"box",  x: -(s.halfW + 800)});
    if((s.zone === "school" || s.zone === "loop") && n % 22 === 0)
      s.sprites.push({t:"cone", x: (n % 44 === 0 ? 1 : -1) * (s.halfW + 300)});
  }
}

/* ---------------- state ---------------- */
var position=0, busX=0, speed=0, brakePedal=0, brakeTarget=0, prevBrake=0, bite=0;
var bgOff=0, tAcc=0, elapsed=0, running=false, mode="start";
var pSeg=null, playerY=0, steerVis=0, steerSm=0, rowdy=0, prevPX=0, honk=0, busXVel=0;
var water=50, bladder=0, overFull=false, heat=88, dim=0, incident=false, hasDrunk=false;
var acCharge=0, acHits=0, fanAng=0, sparks=[], honkT=0, driftDamage=0, jolt=0, drips=[], holes=[];
var bladderPop=0, popBits=[];
var curZone="school", zoneShown="";
var stat = { onRoad:0, total:0, samples:0, topSpeed:0, offEvents:0, wasOff:false,
             rowdy:0, collisions:0, headons:0, pedHits:0, redLights:0, crossings:0, dimT:0, speeding:0,
             potholes:0, honks:0 };

/* ---------------- traffic ---------------- */
var cars = [], cutTimer = 0, playerAim = 0;
var CAR_COLORS = ["#c94f3d","#3f6fa8","#cfd3d8","#4c5560","#7a9b5e","#b9873f","#8d5f9e","#d9c46b"];
var CAR_POOL = 34;

function segAt(z){ return segments[clamp(Math.floor(z / SEG_LEN), 0, segments.length-1)]; }
function zoneCars(seg){ return Math.min(CAR_POOL, Math.round(ZONES[seg.zone].cars * 9 * P.trafficDensity)); }

function newCar(z, oncoming){
  var seg = segAt(z), lanes = seg.lanes, r = laneRange(seg, oncoming ? -1 : 1);
  if(r.hi < r.lo){ oncoming = false; r = laneRange(seg, 1); }
  var lane = r.lo + Math.floor(Math.random() * (r.hi - r.lo + 1));
  return {
    z:z, lane:lane, x:laneX(lane, lanes), dir: oncoming ? -1 : 1,
    eager: 0.96 + Math.random()*0.20, speed:0,
    color: CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)],
    stage:"cruise", t:0, braking:false, signal:0, hit:0, targetX:0,
    laneTimer: Math.random()*1.4, stuck:0, active:true
  };
}
function desiredSpeed(car){
  var ms = maxSpeed();
  if(car.dir < 0) return ms * 0.85 * car.eager;          /* oncoming keeps its own pace */
  return clamp(Math.max(speed * P.trafficSpeed * car.eager, ms * P.trafficFloor), 0, ms * 1.35);
}
function cutting(car){ return car.stage==="signal"||car.stage==="merge"||car.stage==="brake"; }

function placeCar(car, ahead){
  var bz = busZ();
  var z = ahead ? bz + DRAW_DIST*SEG_LEN*(0.58 + Math.random()*0.40)
                : bz - SPAWN_BACK - Math.random()*BEHIND_BAND;
  var seg = segAt(z);
  var oncoming = seg.onc && Math.random() < 0.45;
  if(oncoming) z = bz + DRAW_DIST*SEG_LEN*(0.5 + Math.random()*0.5);
  var fresh = newCar(z, oncoming);
  for(var k in fresh) car[k] = fresh[k];
  /* never drop one into the bus's own lane right behind it */
  if(!ahead && car.dir > 0 && (bz - z) < SPAWN_BACK*1.8){
    var rr = laneRange(seg, 1), tries = 0;
    while(Math.abs(car.x - busX) < CLEAR_X && tries++ < 8){
      car.lane = rr.lo + Math.floor(Math.random()*(rr.hi - rr.lo + 1));
      car.x = laneX(car.lane, seg.lanes);
    }
  }
  car.speed = car.dir < 0 ? desiredSpeed(car)
            : Math.min(desiredSpeed(car), Math.max(speed, maxSpeed()*P.trafficFloor));
}
function seedCars(){
  cars = [];
  for(var i=0;i<CAR_POOL;i++){
    var c = newCar(0, false);
    cars.push(c);
    placeCar(c, i % 2 === 0 ? false : true);
  }
}

function aheadOf(car, bz){
  var bestD = 1e9, bestS = 0, found = false, j, o, d;
  if(car.dir > 0 && !cutting(car) &&
     (Math.abs(busX - car.x) < SEE_X || Math.abs(playerAim - car.x) < SEE_X)){
    d = bz - car.z;
    if(d > 0 && d < bestD){ bestD = d; bestS = speed; found = true; }
  }
  for(j=0;j<cars.length;j++){
    o = cars[j];
    if(o === car || !o.active || o.dir !== car.dir) continue;
    if(Math.abs(o.x - car.x) < SEE_CAR_X){
      d = (o.z - car.z) * car.dir;
      if(d > 0 && d < bestD){ bestD = d; bestS = o.speed; found = true; }
    }
  }
  return found ? { d:bestD, s:bestS } : null;
}
/* Traffic obeys the signals too, so a red light becomes a queue you have to
   read rather than a rule only the bus follows. */
function redStopFor(car){
  for(var i=0;i<lights.length;i++){
    var L = lights[i], d = (L.z - car.z) * car.dir;
    if(d > -140 && d < 7000 && L.state !== "green") return d;
  }
  for(var j=0;j<crossings.length;j++){
    var X = crossings[j], d2 = (X.z - car.z) * car.dir;
    if(d2 > -140 && d2 < 7000 && X.state === "down") return d2;
  }
  return null;
}
function laneClear(car, lane, seg, bz){
  var r = laneRange(seg, car.dir);
  if(lane < r.lo || lane > r.hi) return false;
  var x = laneX(lane, seg.lanes), j, o;
  if(car.dir > 0 && (Math.abs(x - busX) < CLEAR_X || Math.abs(x - playerAim) < CLEAR_X)
     && bz > car.z - 2200 && bz < car.z + 3600) return false;
  for(j=0;j<cars.length;j++){
    o = cars[j];
    if(o === car || !o.active) continue;
    if(Math.abs(x - o.x) < CAR_W + 460 && o.z > car.z - 1800 && o.z < car.z + 3600) return false;
  }
  return true;
}

function updateCars(dt){
  var bz = busZ(), ms = maxSpeed(), spd = speed/ms, i, car;
  var here = segAt(bz), want_n = zoneCars(here);
  playerAim = clamp(busX + busXVel * 0.7, -20000, 20000);

  cutTimer -= dt;
  if(cutTimer <= 0 && running && want_n > 0){
    var cutMul = ZONES[here.zone].cutMul;
    var interval = Math.max(P.cutFloor, P.cutBase / Math.max(0.2, cutMul) / (1 + (1 - spd) * P.cutAggression));
    cutTimer = interval * (0.75 + Math.random()*0.5);
    var best = null, bestD = 1e9;
    for(i=0;i<cars.length;i++){
      car = cars[i];
      if(!car.active || car.dir < 0 || car.stage !== "cruise") continue;
      var dz = car.z - bz, dx = Math.abs(car.x - busX);
      if(dz > 2000 && dz < 5200 && dx > HIT_X*1.2 && dx < LANE_W*2.4 && dz < bestD){ best = car; bestD = dz; }
    }
    if(best && cutMul > 0){
      /* a cut-off aims at your lane, but never across the centreline */
      var bseg = segAt(best.z), br = laneRange(bseg, 1);
      best.stage = "signal"; best.t = 0.5;
      best.signal = busX > best.x ? 1 : -1;
      best.targetX = clamp(busX, laneX(br.lo, bseg.lanes), laneX(br.hi, bseg.lanes));
    }
  }

  for(i=0;i<cars.length;i++){
    car = cars[i];
    car.active = i < want_n || car.dir < 0 && i < want_n + 4;
    if(!car.active) continue;
    if(car.hit > 0) car.hit -= dt;
    var seg = segAt(car.z);
    var rlim = laneRange(seg, car.dir);
    if(rlim.hi < rlim.lo){ placeCar(car, car.dir < 0); continue; }   /* no lane for it here */
    car.lane = clamp(car.lane, rlim.lo, rlim.hi);
    var want = desiredSpeed(car), panic = false;
    /* braking becomes a per-frame flag so the sound can fire on the edge;
       every branch below that wants brake lights still sets it true */
    car.brakePrev = car.braking; car.braking = false;

    if(car.stage === "signal"){
      car.t -= dt; if(car.t <= 0){ car.stage = "merge"; car.t = 0.75; }
    } else if(car.stage === "merge"){
      car.t -= dt;
      car.x += (car.targetX - car.x) * Math.min(1, dt * 4.0);
      if(car.t <= 0){ car.stage = "brake"; car.t = 1.8; car.signal = 0; }
    } else if(car.stage === "brake"){
      car.t -= dt; car.braking = true; want *= P.cutBrake;
      if(car.t <= 0){ car.stage = "recover"; car.t = 2.2; car.braking = false; }
    } else if(car.stage === "recover"){
      car.t -= dt; if(car.t <= 0){ car.stage = "cruise"; car.laneTimer = 0.5; }
    } else {
      car.braking = false;
      car.laneTimer -= dt;
      var blocked = aheadOf(car, bz);
      /* Impatience: a car held up by the bus gets antsy faster than one held
         up by an ordinary car, which is the whole social fact this game is
         about. Antsy cars go looking for a way past. */
      var byBus = car.dir > 0 && blocked && Math.abs(blocked.s - speed) < 1 &&
                  Math.abs(busX - car.x) < SEE_X && bz > car.z;
      if(byBus) car.stuck += dt * P.impatience; else car.stuck = Math.max(0, car.stuck - dt);
      var eager = car.laneTimer <= 0 || (byBus && car.stuck > 1.2);
      if(blocked && blocked.d < P.followGap * (byBus ? 2.4 : 1.5) &&
         blocked.s < car.speed * 0.99 && eager){
        var rng = laneRange(seg, car.dir), order = [];
        if(car.lane > rng.lo) order.push(car.lane - 1);
        if(car.lane < rng.hi) order.push(car.lane + 1);
        if(order.length === 2 && Math.random() < 0.5) order.reverse();
        for(var q=0;q<order.length;q++){
          if(laneClear(car, order[q], seg, bz)){
            car.signal = order[q] > car.lane ? 1 : -1;
            car.lane = order[q]; car.laneTimer = 1.9; car.stuck = 0;
            break;
          }
        }
      }
      var tgt = laneX(car.lane, seg.lanes);
      car.x += (tgt - car.x) * Math.min(1, dt * 2.1);
      if(Math.abs(tgt - car.x) < 60) car.signal = 0;
    }

    var ob = aheadOf(car, bz);
    if(ob){
      var safe = P.followGap + car.speed * 0.30, minGap = HIT_Z * 1.45;
      if(ob.d < safe){
        var tt = clamp((ob.d - minGap) / Math.max(1, safe - minGap), 0, 1);
        want = Math.min(want, lerp(ob.s * 0.72, want, tt));
        if(tt < 0.55 && ob.s < car.speed) car.braking = true;
      }
      if(ob.d < HIT_Z * 2.6 && ob.s < car.speed){
        want = Math.min(want, ob.s * 0.45); car.braking = true; panic = true;
      }
    }
    var stopD = redStopFor(car);
    if(stopD !== null){
      var brakeZone = 300 + car.speed * 1.5;
      if(stopD < brakeZone){
        want = Math.min(want, Math.max(0, (stopD - 160) / brakeZone) * want);
        car.braking = true;
        if(stopD < 260) { want = 0; panic = true; }
      }
    }

    /* Hard guarantee: nothing rear-ends the bus. */
    if(car.dir > 0 && !cutting(car)){
      var back = bz - car.z;
      var lat = Math.min(Math.abs(busX - car.x), Math.abs(playerAim - car.x));
      if(back > 0 && back < HIT_Z * 3.4 && lat < SEE_X){
        var pin = back < HIT_Z * 1.7 ? 0.5 : 0.92;
        if(want > speed * pin){ want = speed * pin; car.braking = true; panic = true; }
      }
    }

    car.speed += (want - car.speed) * Math.min(1, dt * (panic ? 8 : (car.stage === "brake" ? 4.5 : 2.4)));
    car.speed = Math.max(0, car.speed);
    car.z += car.speed * dt * car.dir;

    var ddz = car.z - bz;
    if(car.hit <= 0 && Math.abs(ddz) < HIT_Z && Math.abs(car.x - busX) < HIT_X){
      car.hit = 0.9;
      if(car.dir < 0){
        stat.headons++; speed *= 0.25; rowdy = 1;
        flash("HEAD-ON", "big", 2.4);
      } else {
        stat.collisions++; speed = Math.min(speed, car.speed * 0.55);
        rowdy = clamp(rowdy + 0.45, 0, 1);
        flash("CLIPPED A CAR", "", 1.2);
      }
      busX += (busX > car.x ? 240 : -240);
      car.speed *= 0.85;
    }

    if(car.dir > 0){
      if(car.z > bz + DRAW_DIST*SEG_LEN*1.05)      placeCar(car, false);
      else if(car.z < bz - BEHIND_BAND*1.3)        placeCar(car, true);
    } else {
      if(car.z < bz - 3000 || car.z > bz + DRAW_DIST*SEG_LEN*1.1) placeCar(car, true);
    }
  }

  honk = 0;
  for(i=0;i<cars.length;i++){
    if(!cars[i].active || cars[i].dir < 0) continue;
    var dd = bz - cars[i].z;
    if(dd > 0 && dd < 2600 && Math.abs(cars[i].x - busX) < SEE_X && spd < 0.72){ honk = 1; break; }
  }
  if(honk && running) rowdy = clamp(rowdy + 0.05 * dt, 0, 1);
}

/* ---------------- pedestrians ---------------- */
function updatePeds(dt){
  var bz = busZ(), mph = speed / upm(), i, p;
  for(i=0;i<peds.length;i++){
    p = peds[i];
    var dz = p.z - bz;
    if(dz < -3000 || dz > DRAW_DIST*SEG_LEN) continue;
    var seg = segAt(p.z), hw = seg.halfW;
    if(p.scram > 0) p.scram -= dt;
    /* They cross once and stay put on the far verge. Someone standing on the
       kerb is not a hazard; someone in the road is. */
    /* They reach the kerb, stand there a moment, then set off back across.
       Nobody ever actually finishes the errand. */
    if(p.wait > 0){ p.wait -= dt; }
    else if(p.x * p.dir < hw + 500){ p.x += p.speed * p.dir * dt * (p.scram > 0 ? P.scramDash : 1); }
    else {
      p.wait = P.pedPause; p.dir = -p.dir;
      p.near = false; p.honked = false; p.dive = 0;
    }

    /* Nobody gets run over. If the bus reaches them they dive clear at the
       last possible moment - it still counts against you, and the kids see it,
       but there is no violence in it. Honk and they are gone before you
       arrive, which is what the horn is for. */
    if(!p.near && !p.done && !p.honked && running &&
       Math.abs(dz) < PED_HIT_Z && Math.abs(p.x - busX) < PED_HIT_X + p.speed*0.15){
      p.near = true; p.scram = 1.4;
      p.dive = (p.x > busX ? 1 : -1);
      stat.pedHits++;
      rowdy = clamp(rowdy + 0.6, 0, 1);
      flash("THEY JUMPED CLEAR", "big", 2.2);
    }
    if(p.dive){ p.x += p.dive * 1500 * (P.scramDash / 4.4) * dt * Math.max(0, p.scram); }
  }
}

/* ---------------- traffic lights ---------------- */
/* A train comes through every so often; the gates drop, and the only thing
   to do is stop and let the kids get louder. */
/* One skid per event, from cars ahead of the bus and close enough to hear,
   rate-limited so a lane full of brake lights is not a wall of noise. */
function brakeSounds(dt){
  brakeCool = Math.max(0, brakeCool - dt);
  if(brakeCool > 0 || !audioBuilt || !audioOn) return;
  var bz = busZ();
  for(var i=0;i<cars.length;i++){
    var c = cars[i];
    if(!c.active || c.dir < 0 || c.brakePrev || !c.braking) continue;
    var dz = c.z - bz;
    if(dz < 200 || dz > 7000) continue;
    if(Math.abs(c.x - busX) > LANE_W * 2.2) continue;
    play("brake", clamp(1 - dz / 8200, 0.25, 1));
    brakeCool = 0.4;
    return;
  }
}
function updateCrossings(dt){
  var bz = busZ(), i, X;
  for(i=0;i<crossings.length;i++){
    X = crossings[i];
    X.phase += dt;
    var cyc = P.trainCycle, t = X.phase % cyc;
    var was = X.state;
    X.state = t < cyc - P.trainDown ? "clear" : "down";
    if(X.state === "down"){
      var into = (t - (cyc - P.trainDown)) / P.trainDown;
      X.trainX = (into - 0.5) * 34000;
    }
    if(was === "clear" && X.state === "down" && Math.abs(X.z - bz) < 16000)
      flash("TRAIN COMING", "calm", 2.0);
    if(!X.ran && bz > X.z + 200 && running){
      X.ran = true;
      if(X.state === "down"){
        stat.crossings++;
        rowdy = 1; speed *= 0.3;
        flash("YOU WENT ROUND THE GATES", "big", 2.6);
      }
    }
  }
}
function updateLights(dt){
  var bz = busZ(), cyc = P.lightCycle, i, L;
  for(i=0;i<lights.length;i++){
    L = lights[i];
    L.phase += dt;
    var t = L.phase % (cyc * 2);
    L.state = t < cyc ? "green" : (t < cyc + 2.2 ? "amber" : "red");
    if(!L.ran && bz > L.z + 200 && running){
      L.ran = true;
      if(L.state === "red"){
        stat.redLights++;
        rowdy = clamp(rowdy + 0.30, 0, 1);
        flash("RAN A RED LIGHT", "", 2.0);
      }
    }
  }
}

/* ---------------- banners ---------------- */
var banners = [], flashEl = document.getElementById("flash"),
    adviceEl = document.getElementById("advice"), adviceKey = "";
function flash(text, cls, secs){
  for(var i=0;i<banners.length;i++) if(banners[i].text === text){ banners[i].t = secs; return; }
  banners.push({text:text, cls:cls||"", t:secs});
}
function tickBanners(dt){
  var changed = false;
  for(var i=banners.length-1;i>=0;i--){
    banners[i].t -= dt;
    if(banners[i].t <= 0){ banners.splice(i,1); changed = true; }
  }
  var key = banners.map(function(b){ return b.cls + "|" + b.text; }).join("~");
  if(changed || key !== flashEl.dataset.key){
    flashEl.dataset.key = key;
    flashEl.innerHTML = banners.map(function(b){
      return '<div class="banner ' + b.cls + '">' + b.text + '</div>';
    }).join("");
  }
  var adv = advisories();
  var ak = adv.map(function(a){ return a[2] + "|" + a[3]; }).join("~");
  if(ak !== adviceKey){
    adviceKey = ak;
    adviceEl.innerHTML = adv.map(function(a){
      return '<div class="adv' + (a[1] ? " hot" : "") + '"><em>' + a[2] + '</em>' +
             (a[3] ? '<span>' + a[3] + '</span>' : '') + '</div>';
    }).join("");
  }
}

function resetRun(rebuild){
  if(rebuild || segments.length === 0) buildRoad();
  position=0; speed=0; brakePedal=0; brakeTarget=0; prevBrake=0; bite=0;
  bgOff=0; elapsed=0; running=false; steerVis=0; steerSm=0; rowdy=0; honk=0; busXVel=0;
  water=P.startWater; bladder=0; overFull=false; heat=P.heatStart; dim=0; incident=false; hasDrunk=false;
  acCharge = Math.round(P.acTaps); acHits=0; sparks=[]; honkT=0; driftDamage=0; jolt=0; drips=[];
  bladderPop=0; popBits=[];
  for(var h=0;h<holes.length;h++) holes[h].hit = false;
  cutTimer=1.5; curZone="school"; zoneShown="";
  busX = laneX(firstOwnLane(segments[0]), segments[0].lanes); prevPX = busX;
  for(var i=0;i<lights.length;i++){ lights[i].ran = false; lights[i].phase = Math.random()*P.lightCycle*2; }
  for(var x=0;x<crossings.length;x++){ crossings[x].ran = false; crossings[x].phase = Math.random()*P.trainCycle; }
  for(var j=0;j<peds.length;j++){
    peds[j].near = false; peds[j].done = false; peds[j].honked = false;
    peds[j].scram = 0; peds[j].dive = 0; peds[j].wait = 0;
    peds[j].x = -peds[j].dir * (segAt(peds[j].z).halfW + 700);
  }
  stat = { onRoad:0, total:0, samples:0, topSpeed:0, offEvents:0, wasOff:false,
           rowdy:0, collisions:0, headons:0, pedHits:0, redLights:0, crossings:0, dimT:0, speeding:0,
             potholes:0, honks:0 };
  banners = []; forkAt = -1; forkLocked = false; forkDoneAt = -1; carveEnd = -1;
  if(fkEl) fkEl.hidden = true;
  pSeg = segments[0]; playerY = 0;
  seedCars();
  mode = "start"; showStart();
}

/* ---------------- input ---------------- */
var keys = {up:false,down:false,left:false,right:false,drink:false};
function isSlider(t){ return t && t.tagName === "INPUT" && t.type === "range"; }
function keyed(e, down){
  var c = e.code, hit = true;
  /* Read the mode before anything below can change it: the start-screen branch
     flips it to "drive", and Space was then falling through to the horn in the
     same keypress - one tap both pulled away and honked. */
  var wasStart = (mode === "start");
  if(c==="Space" && e.target && e.target.tagName === "BUTTON") return;   /* let buttons take it */
  if(c==="ArrowUp") keys.up = down;
  else if(c==="ArrowDown") keys.down = down;
  else if(c==="ArrowLeft") keys.left = down;
  else if(c==="ArrowRight") keys.right = down;
  else if(c==="KeyW") keys.drink = down;
  else if(c==="KeyS"||c==="Space") hit = true;
  else hit = false;
  if(hit && !(isSlider(e.target) && c.indexOf("Arrow") === 0)){
    e.preventDefault();
    if(down && mode === "start" && c !== "Space"){ startRun(); }
  } else if(hit && isSlider(e.target)){
    keys.up = keys.down = keys.left = keys.right = false;
  }
  if(!down) return;
  if(!audioBuilt && !isSlider(e.target)) startBeds();
  if(c==="KeyM" && !isSlider(e.target) && e.target.tagName !== "BUTTON") toggleMute();
  if(c==="KeyS" && !isSlider(e.target)) smackAC();
  if(c==="Space" && !isSlider(e.target) && e.target.tagName !== "BUTTON"){
    if(wasStart){ e.preventDefault(); startRun(); } else honkHorn();
  }
  if(c==="KeyR" && !isSlider(e.target)) resetRun(false);
  if(c==="Escape") closePanel();
  if(c==="Backquote"){ e.preventDefault(); togglePanel(); }
}
window.addEventListener("pointerdown", function(){ if(!audioBuilt) startBeds(); }, { once:false });
window.addEventListener("keydown", function(e){ keyed(e,true); });
window.addEventListener("keyup",   function(e){ keyed(e,false); });
window.addEventListener("blur", function(){
  keys.up=keys.down=keys.left=keys.right=keys.drink=false;
});

/* The A/C is broken. Hitting the dash gets it going for a few seconds, which
   is the one lever the player has over the heat that drives everything else. */
/* The fan runs off a six-segment charge that bleeds away over its run time.
   At zero it dies, and every smack of S puts one segment back. Fill all six
   and it kicks in again. */
function smackAC(){
  if(!running || acCharge > 0) return;
  acHits++;
  play("slap");
  for(var i=0;i<8;i++) sparks.push({ a: Math.random()*6.28, v: 45 + Math.random()*95, t: 0.45, life: 0.45 });
  if(acHits >= Math.round(P.acTaps)){
    acHits = 0; acCharge = Math.round(P.acTaps);
    flash("A/C \u2014 FOR NOW", "calm", 1.2);
  }
}
/* The horn clears people out of the road without slowing down, and winds the
   kids up for it. A trade, not a free out. */
function honkHorn(){
  if(!running || honkT > 0.25) return;
  honkT = 0.55; stat.honks++;
  play("horn");
  rowdy = clamp(rowdy + P.honkRowdy, 0, 1);
  var bz = busZ(), yelled = [];
  for(var i=0;i<peds.length;i++){
    var pd = peds[i], dz = pd.z - bz;
    /* half the old reach: the horn should not be scattering people three
       blocks away, and only the ones it actually moves shout back */
    if(!pd.done && dz > -400 && dz < 5500){
      yelled.push(Math.abs(dz));
      /* They bolt for whichever kerb is closer, turning back the way they
         came if that is nearer - nobody finishes crossing to be polite. */
      pd.dir = pd.x < 0 ? -1 : 1;
      pd.scram = 1.8; pd.honked = true;
    }
  }
  /* Nearest shouts first, then the next one 50ms later, so three people
     scattering reads as three people rather than one loud noise. */
  yelled.sort(function(a,b){ return a - b; });
  for(var y=0; y<Math.min(3, yelled.length); y++){
    (function(n, clip){ setTimeout(function(){ play(clip); }, n * 50); })(y, nextYell());
  }
  /* And it shames whoever is in the middle of cutting you off back into
     their own lane. */
  for(var j=0;j<cars.length;j++){
    var c2 = cars[j];
    if(!c2.active || c2.dir < 0) continue;
    var cd = c2.z - bz;
    if(cutting(c2) && cd > -1200 && cd < 9000){
      c2.stage = "cruise"; c2.signal = 0; c2.braking = false;
      c2.t = 0; c2.laneTimer = 0;
      var cseg = segAt(c2.z), rr2 = laneRange(cseg, 1);
      var away = busX >= 0 ? rr2.lo : rr2.hi;
      c2.lane = clamp(away, rr2.lo, rr2.hi);
    }
  }
}

/* At every boundary between the fixed opening and the run home, two roads.
   The sign goes up early; whichever side of the road the bus is on when the
   choice locks is the one you take. Locking happens 260 segments out, well
   past the draw distance, so the road never changes under you. */
/* Junction timeline, in segments before the boundary. Zones here run 200-500
   segments, so these numbers are a budget, not a wish: the approach has to fit
   inside one zone alongside the previous junction's merge, and it has to be
   carved while it is still buried in fog (past ~150 segments the road is 91%
   fogged, past 180 it is 97%) or the exit road pops into existence in view.
     SHOW    how long the exit road runs alongside before the boundary
     SIGN    when the overhead sign appears
     LOCK    when the choice is taken and the route past the junction rebuilds
     MERGE   how far past the boundary the exit takes to rejoin
   LOCK also has to be far enough out that the rebuild happens in fog. */
var FORK_SHOW = 330, FORK_SIGN = 300, FORK_LOCK = 150, MERGE_LEN = 170,
    FORK_MIN_SPAN = 360, carveEnd = -1, forkDoneAt = -1, fkEl, fkL, fkR;
/* Junctions are switched off: picking the next biome at speed was one job too
   many on top of the bus, the kids, the heat and the bladder, and the route
   now covers every biome anyway so there is nothing to choose between. All the
   exit-road geometry below is intact and comes back with this flag. */
var FORKS_ON = false;
function forkableZone(zi){
  return FORKS_ON && zi >= 2 && zi < routePlan.length - 2;
}
function updateFork(){
  if(!FORKS_ON){ hideFork(); return; }
  if(!running) return;
  var here = clamp(Math.floor(busZ() / SEG_LEN), 0, segments.length-1);
  var zi = -1;
  for(var i=0;i<zoneSpans.length;i++) if(here >= zoneSpans[i].from && here < zoneSpans[i].to){ zi = i; break; }
  /* one decision per junction - without this the fork re-offers itself
     the moment it is hidden and re-plans the route every frame */
  if(zi < 0 || !forkableZone(zi + 1)){ hideFork(); return; }
  /* Once locked the sign stays up showing which way you are going, until the
     zone ends - the split itself is still a couple of hundred segments ahead,
     and a junction with no sign over it reads as a mistake. */
  if(zi === forkDoneAt) return;
  var boundary = zoneSpans[zi].to, toGo = boundary - here;
  var span = zoneSpans[zi].to - zoneSpans[zi].from;
  /* A junction needs room: the previous one's merge runs 320 segments into
     this zone, and if this one's approach reaches back over it the two carves
     fight and the gore jumps a lane wide between one segment and the next.
     Short zones simply do not get a junction. */
  if(span < FORK_MIN_SPAN){ hideFork(); return; }

  if(forkAt !== zi){
    /* Carve on the first frame inside the zone, so the far end of the approach
       is still ~180 segments out and invisible. The sign comes later. */
    if(toGo > span - 12) { hideFork(); return; }
    forkAt = zi; forkLocked = false;
    var planned = routePlan[zi + 1];
    var alt = MID_POOL[Math.floor(Math.random()*MID_POOL.length)];
    var guard = 0;
    while(alt === planned && guard++ < 12) alt = MID_POOL[Math.floor(Math.random()*MID_POOL.length)];
    forkOpts = Math.random() < 0.5 ? { left:planned, right:alt } : { left:alt, right:planned };
    fkEl.hidden = true;
    fkL.innerHTML = '<span class="a">STRAIGHT ON</span><span class="z">' + ZONES[forkOpts.left].name + '</span>';
    fkR.innerHTML = '<span class="a">EXIT RIGHT \u2192</span><span class="z">' + ZONES[forkOpts.right].name + '</span>';
    /* The approach. The exit road opens alongside first - a deceleration lane
       you drift into rather than a key you press - and then the gore opens
       between them and the two roads visibly part.
       rs never reaches back over the previous junction's merge: overlapping
       carves put the exit road in one place and its grass in another. */
    var rs = Math.max(boundary - FORK_SHOW, carveEnd + 1), re = boundary - 1;
    for(var q = Math.max(0, rs); q <= re && q < segments.length; q++){
      var u = (q - rs) / Math.max(1, re - rs);
      var w = LANE_W * P.apronLanes * easeInOut(0, 1, clamp(u / 0.24, 0, 1));
      /* The gore opens across the whole rest of the approach, not a short
         burst of it. Opened over a third it slid right at ~1400 units a
         second, which is faster than this bus can steer - you were dumped in
         the grass for following the road you picked. */
      var g = LANE_W * P.goreLanes * easeIn(0, 1, clamp((u - 0.28) / 0.72, 0, 1));
      setExit(q, w, g);
    }
    carveEnd = re;
  }
  if(forkLocked){ return; }
  if(toGo <= FORK_SIGN) fkEl.hidden = false;
  /* You are taking the exit if you are on the exit road, or far enough right
     that you plainly mean to be. */
  var onRamp = (pSeg.exitW > 0 && busX > exitLo(pSeg) - 200) || busX > pSeg.halfW * 0.55;
  fkL.className = "fk" + (onRamp ? "" : " on");
  fkR.className = "fk" + (onRamp ? " on" : "");
  if(toGo <= FORK_LOCK){
    forkLocked = true; forkDoneAt = zi;
    var pick = onRamp ? forkOpts.right : forkOpts.left;
    if(pick !== routePlan[zi + 1]){
      routePlan[zi + 1] = pick;
      rebuildFrom(zi + 1);
    }
    /* Past the junction there is one road again. The gore closes and the exit
       lane narrows away, so whichever side you committed to you end up back on
       the surface - you just have to follow it left, against the bus's own
       pull, if you took the exit. Nobody gets stranded on vanishing tarmac. */
    var W0 = LANE_W * P.apronLanes, G0 = LANE_W * P.goreLanes;
    var nextEnd = (zoneSpans[zi+1] ? zoneSpans[zi+1].to : segments.length) - 1;
    var stop = Math.min(boundary + MERGE_LEN, nextEnd);
    for(var q2 = boundary; q2 <= stop && q2 < segments.length; q2++){
      var v = (q2 - boundary) / Math.max(1, stop - boundary);
      setExit(q2, easeInOut(W0, 0, clamp((v - 0.45) / 0.55, 0, 1)),
                  easeInOut(G0, 0, clamp(v / 0.60, 0, 1)));
    }
    carveEnd = stop;
    fkL.className = "fk" + (onRamp ? " off" : " on");
    fkR.className = "fk" + (onRamp ? " on" : " off");
    flash(ZONES[pick].name.toUpperCase(), "gold", 1.8);
  }
}
/* Width and gore are always written together - they are one road, and letting
   them come from different carves put the exit in one place and its grass in
   another. Carve ranges are exclusive (see carveEnd), so this can assign. */
function setExit(q, w, gap){
  var sg = segments[q]; if(!sg) return;
  sg.exitW = w; sg.exitGap = gap;
  clearApron(q);
}
/* The trees and lamp posts were placed against the old road edge at build
   time; the exit is carved later, at runtime, so anything on the right has
   to move out or it ends up standing in it. */
function clearApron(q){
  var sg = segments[q]; if(!sg) return;
  var edge = rightEdge(sg);   /* the far side of the exit road, not of the main one */
  for(var w = 0; w < sg.sprites.length; w++){
    var spr = sg.sprites[w];
    if(spr.x > 0 && spr.x < edge + 700) spr.x = edge + 700 + (spr.x - sg.halfW);
  }
}
function hideFork(){ if(fkEl) fkEl.hidden = true; }

/* ---------------- simulation ---------------- */
function update(dt){
  var ms = maxSpeed(), accel = ms / P.accelTime;
  var pIdx = clamp(Math.floor(busZ() / SEG_LEN), 0, segments.length-1);
  pSeg = segments[pIdx];
  var pPct = ((((busZ()) % SEG_LEN) + SEG_LEN) % SEG_LEN) / SEG_LEN;
  playerY = pSeg.p1.world.y + (pSeg.p2.world.y - pSeg.p1.world.y) * pPct;
  curZone = pSeg.zone;
  if(!running) return;

  var off = !onSurface(pSeg, busX);
  if(keys.up) speed += accel * dt;
  else speed -= ms * P.coastDrag * 0.1 * dt;

  brakeTarget = keys.down ? 1 : 0;
  if(brakeTarget === 1 && prevBrake === 0) bite = P.pumpBite;
  prevBrake = brakeTarget;
  bite = Math.max(0, bite - dt * 1.5);
  var kk = P.brakeLag <= 1 ? 1 : (1 - Math.exp(-dt * 1000 / P.brakeLag));
  brakePedal += (brakeTarget - brakePedal) * kk;
  speed -= brakePedal * (ms / 3.1) * P.brakeStrength * (1 + bite) * dt;
  if(off){
    var cap = ms * P.offroadCap;
    if(speed > cap) speed -= ms * P.offroadDrag * dt;
    else            speed -= speed * P.offroadDrag * 0.35 * dt;
  }
  speed = clamp(speed, 0, ms);
  var spd = speed / ms, stopped = spd < 0.02;

  /* ---- the body ---- */
  var acSegs = Math.round(P.acTaps);
  if(acCharge > 0){
    acCharge = Math.max(0, acCharge - (acSegs / P.acSecs) * dt);
    if(acCharge === 0){
      acHits = 0;
      /* it does not just stop, it lets go */
      for(var sk=0; sk<46; sk++)
        sparks.push({ a: Math.random()*6.28, v: 70 + Math.random()*260,
                      t: 0.7 + Math.random()*0.75, life: 1.45 });
    }
  }
  var acOn = acCharge > 0;
  /* No airflow through a broken A/C: the slower you crawl, the faster the
     cabin bakes and the faster you dry out - and a dead fan multiplies it. */
  var stagnant = 1 + P.crawlHeat * (1 - clamp(speed / maxSpeed(), 0, 1));
  /* The cabin only ever climbs. A working fan takes the dead-fan multiplier
     off the climb, and above acFloor it actually pulls the temperature down -
     but it will not chase it below that, so there is no cool cabin to bank.
     Dead fan, and the climb triples. */
  var rise = (P.heatRise / 60) * stagnant * (acOn ? 1 : P.acBrokenHeat);
  var cooling = acOn && heat > P.acFloor;
  heat += (rise - (cooling ? P.acDrop / P.acSecs : 0)) * dt;
  if(cooling) heat = Math.max(P.acFloor, heat);
  if(honkT > 0) honkT -= dt;
  var heatF = clamp((heat - 72) / 26, 0, 2.2);
  var sweat = P.sweatFactor * heatF;
  water -= (P.thirstRate + sweat) * stagnant * dt;
  var drinking = keys.drink;
  if(drinking){
    water += P.drinkRate * dt;
    if(!hasDrunk){ hasDrunk = true; flash("THAT'S THE FIRST SIP", "calm", 1.6); }
  }
  /* Once the first sip is down there is no way back. The baseline is set by
     the length of the drive, not a fixed number, so a longer route is not
     automatically a lost one: left alone it fills over bladderSpan x the
     deadline. Drinking adds to it - and drinking while you are already above
     the topping-up line multiplies the whole thing until you fall back under. */
  if(drinking && water >= P.topUpAt) overFull = true;
  if(water < P.topUpAt) overFull = false;
  if(hasDrunk && !incident){
    var bBase = 100 / Math.max(1, P.deadline * P.bladderSpan);
    var bRate = bBase + (drinking ? P.bladderDrink : 0);
    if(overFull) bRate *= P.topUpPenalty;
    bladder += bRate * dt;
  }
  water = clamp(water, 0, 100);
  bladder = clamp(bladder, 0, 100);

  /* Dehydration is no longer an event, it is a slow narrowing. The edges of
     the windscreen close in as you dry out and open back up as you drink, so
     the penalty is that you cannot see the hazards coming rather than a
     moment where control is taken away from you. */
  /* It sets in AT dimStart, not somewhere below it: the old ramp spread the
     onset over the whole remaining 10% of hydration, so nothing was visible
     until about 7%. Full wooziness by dimStart/2. */
  /* Hard gate, not a ramp that happens to reach zero: above the line there is
     no wooziness at all, and it is cleared outright rather than eased out. */
  var dimTarget = water > P.dimStart ? 0
                : clamp((P.dimStart - water) / Math.max(1, P.dimStart * 0.5), 0, 1);
  dim += (dimTarget - dim) * Math.min(1, dt * P.dimSpeed);
  if(water > P.dimStart) dim = 0;
  stat.dimT += dim * dt;
  if(dim > 0.45) rowdy = clamp(rowdy + 0.05 * dt, 0, 1);

  /* It pops. The gauge empties in front of you and then sits at zero for the
     rest of the run - there is nothing left to manage and nothing to win back,
     which is the whole point of the penalty. */
  if(bladder >= 100 && !incident){
    incident = true; rowdy = 1; bladderPop = 1;
    play("incident");
    for(var pb=0; pb<26; pb++)
      popBits.push({ a: Math.random()*6.28, v: 90 + Math.random()*260,
                     t: 0.9 + Math.random()*0.5, r: 2 + Math.random()*4 });
    flash("BLADDER EMPTIED \u2014 DIGNITY LOST", "big", 3.4);
  }
  if(bladderPop > 0) bladderPop = Math.max(0, bladderPop - dt * 1.1);
  if(incident && bladder > 0) bladder = Math.max(0, bladder - 240 * dt);

  /* ---- steering in world units ---- */
  var moving = spd > 0.008 ? 1 : 0;
  var steerIn = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  steerSm += (steerIn - steerSm) * Math.min(1, dt * P.steerEase);
  steerVis += (steerIn - steerVis) * Math.min(1, dt * 9);
  var authority = (STEER_FLOOR + (1 - STEER_FLOOR) * spd) * moving;
  busX += steerSm * authority * P.steerRate * LANE_W * 0.34 * dt;

  /* The pull only shows up once there is real speed on the front wheels. */
  var mphNow = speed / upm();
  var driftScale = clamp((mphNow - P.driftMinMph) / Math.max(1, P.driftRamp), 0, 1) * moving;
  busX += (P.driftRate + driftDamage) * LANE_W * dt * driftScale * (drinking ? P.drinkDrift : 1);
  /* past the threshold you cannot hold a straight line any more */
  if(!incident && bladder > P.swerveAt){
    var sq = (bladder - P.swerveAt) / Math.max(1, 100 - P.swerveAt);
    busX += Math.sin(tAcc * 3.1) * sq * P.swerveAmp * LANE_W * 0.55 * dt
          + Math.sin(tAcc * 7.7) * sq * P.swerveAmp * LANE_W * 0.22 * dt;
  }
  busX -= pSeg.curve * spd * spd * P.centrifugal * LANE_W * 0.22 * dt;
  busX = clamp(busX, -(pSeg.halfW + LANE_W*1.6), pSeg.halfW + LANE_W*1.6);

  busXVel += (((busX - prevPX) / Math.max(dt, 0.0001)) - busXVel) * Math.min(1, dt * 12);
  var lateralRate = Math.abs(busX - prevPX) / Math.max(dt, 0.0001) / LANE_W;
  prevPX = busX;

  /* potholes: they spill the water, jolt the bus, set the kids off and add a
     little permanent misalignment you carry for the rest of the route */
  if(jolt > 0) jolt -= dt;
  var bzh = busZ();
  for(var hh=0; hh<holes.length; hh++){
    var ho = holes[hh];
    if(ho.hit) continue;
    if(Math.abs(ho.z - bzh) < HIT_Z * 0.55 && Math.abs(ho.x - busX) < ho.r + BUS_W*0.4){
      ho.hit = true; stat.potholes++;
      /* NOT named `bite` - that is the brake-pump variable, and a var here
         hoists over it and poisons the brakes with undefined. */
      var kick = P.potholeBite * (0.35 + spd * 0.85);
      jolt = 0.45 * kick;
      busX += (Math.random() < 0.5 ? -1 : 1) * 190 * kick;
      speed *= (1 - 0.10 * kick);
      water = Math.max(0, water - 5 * kick);
      rowdy = clamp(rowdy + 0.22 * kick, 0, 1);
      driftDamage += 0.004 * kick;
      play("pothole");
      flash("POTHOLE", "", 0.8);
    }
  }

  updateCars(dt); updatePeds(dt); updateLights(dt); updateCrossings(dt); updateFork();
  brakeSounds(dt); audioTick();

  /* ---- rowdiness ---- */
  var stir = 0;
  if(off){ if(!stopped) stir += P.offroadRowdy; }
  /* Being stopped at a signal or a crossing is not your fault and the kids
     know it. Being stopped in the middle of the road is. */
  else if(stopped && !heldAtSignal()) stir += P.stalledRowdy;
  var overBy2 = (speed / upm()) - ZONES[pSeg.zone].limit;
  if(overBy2 > 15) stir += P.speedRowdy * clamp((overBy2 - 15) / 15, 0.3, 1.6);
  if(brakePedal > 0.45 && spd > 0.25) stir += (brakePedal - 0.45) * 1.6;
  if(lateralRate > 0.55) stir += Math.min(1.2, (lateralRate - 0.55) * 0.7);
  if(incident) stir += 0.30;
  var zrow = ZONES[pSeg.zone].rowdyMul || 1;
  rowdy = clamp(rowdy + (stir * P.rowdyRise * zrow
                         + (zrow > 1.4 ? P.boredom : 0)
                         - P.rowdyCalm) * dt, 0, 1);

  var limit = ZONES[pSeg.zone].limit;
  var overBy = (speed / upm()) - limit;
  if(overBy > 0) stat.speeding += (overBy / limit) * dt;

  bgOff -= pSeg.curve * spd * dt * 26;
  position += speed * dt;
  elapsed += dt;

  stat.total += dt; stat.samples++; stat.rowdy += rowdy * dt;
  if(!off) stat.onRoad += dt;
  if(off && !stat.wasOff) stat.offEvents++;
  stat.wasOff = off;
  if(speed > stat.topSpeed) stat.topSpeed = speed;

  if(busZ() >= finishZ) finish(true);
  else if(elapsed >= P.deadline) finish(false);
}

/* ---------------- projection + drawing ---------------- */
function project(p, camX, camY, camZ, cd, K, pitch, halfW){
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  p.screen.scale = cd / p.camera.z;
  p.screen.x = Math.round((W/2) + (p.screen.scale * p.camera.x * K));
  p.screen.y = Math.round((H/2) - (p.screen.scale * p.camera.y * K) - pitch);
  p.screen.w = Math.round(p.screen.scale * halfW * K);
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,color){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}
function roundRect(x,y,w,h,rr){
  rr = Math.min(rr, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath();
}
var CSS = getComputedStyle(document.documentElement), COL = {};
function loadColors(){
  ["--sky-top","--sky-mid","--sky-bot","--hill-far","--hill-near","--grass-l","--grass-d",
   "--road-l","--road-d","--rumble-l","--rumble-d","--lane","--yellow","--fog","--bus",
   "--bus-mid","--bus-dark","--body","--body-mid","--body-dark","--body-text","--ink","--sign"].forEach(function(n){
     COL[n] = (CSS.getPropertyValue(n) || "").trim() || "#888";
   });
}
function backdrop(horizon){
  var g = ctx.createLinearGradient(0, Math.min(0, horizon - H*0.7), 0, horizon + H*0.12);
  g.addColorStop(0, COL["--sky-top"]); g.addColorStop(0.55, COL["--sky-mid"]); g.addColorStop(1, COL["--sky-bot"]);
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  drawHills(horizon, 1, COL["--hill-far"],  0.35, H*0.085);
  drawHills(horizon, 2, COL["--hill-near"], 0.75, H*0.055);
}
function drawHills(hz, seed, color, par, amp){
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(-40, hz + 14);
  var off = bgOff * par;
  for(var x=-40; x<=W+40; x+=18){
    var u = (x + off) * 0.006 * seed;
    ctx.lineTo(x, hz - (Math.sin(u)*0.6 + Math.sin(u*2.3 + seed)*0.4) * amp - amp*0.25);
  }
  ctx.lineTo(W+40, hz+14); ctx.closePath(); ctx.fill();
}

function renderSegment(s){
  var a = s.p1.screen, b = s.p2.screen;
  var r1 = a.w/6.5, r2 = b.w/6.5;
  var l1 = Math.max(1, a.w/30), l2 = Math.max(1, b.w/30);
  ctx.fillStyle = ZONES[s.zone].grass;
  if(s.dark) ctx.fillStyle = shade(ctx.fillStyle, -8);
  ctx.fillRect(0, b.y, W, a.y - b.y);
  poly(a.x-a.w-r1, a.y, a.x-a.w, a.y, b.x-b.w, b.y, b.x-b.w-r2, b.y, s.dark ? COL["--rumble-d"] : COL["--rumble-l"]);
  var joined = (a.ew > 0.5 || b.ew > 0.5) && a.gw <= 1.5 && b.gw <= 1.5;
  if(!joined)
    poly(a.x+a.w+r1, a.y, a.x+a.w, a.y, b.x+b.w, b.y, b.x+b.w+r2, b.y, s.dark ? COL["--rumble-d"] : COL["--rumble-l"]);
  poly(a.x-a.w, a.y, a.x+a.w, a.y, b.x+b.w, b.y, b.x-b.w, b.y,
       s.finish ? (s.dark ? "#16181c" : "#f2f4f6") : (s.dark ? COL["--road-d"] : COL["--road-l"]));

  /* The exit road. While it is still alongside (gore closed) it is drawn as a
     widening of the surface with a painted line between; once the gore opens
     it gets its own left rumble strip and becomes a separate road. */
  if(a.ew > 0.5 || b.ew > 0.5){
    var aL = a.x + a.w + a.gw, aR = aL + a.ew,
        bL = b.x + b.w + b.gw, bR = bL + b.ew;
    if(!joined)
      poly(aL - r1, a.y, aL, a.y, bL, b.y, bL - r2, b.y,
           s.dark ? COL["--rumble-d"] : COL["--rumble-l"]);
    poly(aL, a.y, aR, a.y, bR, b.y, bL, b.y,
         s.dark ? COL["--road-d"] : COL["--road-l"]);
    poly(aR, a.y, aR + r1, a.y, bR + r2, b.y, bR, b.y,
         s.dark ? COL["--rumble-d"] : COL["--rumble-l"]);
    if(joined && !s.dark)
      poly(a.x+a.w-l1/2, a.y, a.x+a.w+l1/2, a.y, b.x+b.w+l2/2, b.y, b.x+b.w-l2/2, b.y, COL["--lane"]);
    /* chevrons on the nose of the gore, where the two roads part */
    if(!joined && a.gw > 3 && a.gw < 46 && !s.dark)
      poly(a.x+a.w+2, a.y, aL - 2, a.y, bL - 2, b.y, b.x+b.w+2, b.y, "#d9d3c4");
  }
  if(!s.finish && s.lanes > 1){
    var first = firstOwnLane(s);
    for(var l=1;l<s.lanes;l++){
      var fx = laneX(l, s.lanes + 1) * 0 + ((l - s.lanes/2) * LANE_W) / s.halfW;
      var x1 = a.x + fx*a.w, x2 = b.x + fx*b.w;
      var centre = s.onc && l === first;
      if(centre){
        poly(x1-l1*2.2, a.y, x1-l1*0.6, a.y, x2-l2*0.6, b.y, x2-l2*2.2, b.y, COL["--yellow"]);
        poly(x1+l1*0.6, a.y, x1+l1*2.2, a.y, x2+l2*2.2, b.y, x2+l2*0.6, b.y, COL["--yellow"]);
      } else if(!s.dark){
        poly(x1-l1/2, a.y, x1+l1/2, a.y, x2+l2/2, b.y, x2-l2/2, b.y, COL["--lane"]);
      }
    }
  }
  if(s.fog < 0.995){
    ctx.globalAlpha = 1 - s.fog; ctx.fillStyle = COL["--fog"];
    ctx.fillRect(0, b.y, W, a.y - b.y); ctx.globalAlpha = 1;
  }
}
function shade(hex, amt){
  var m = /^#([0-9a-f]{6})$/i.exec(hex); if(!m) return hex;
  var v = parseInt(m[1],16);
  var r = clamp(((v>>16)&255)+amt,0,255), g = clamp(((v>>8)&255)+amt,0,255), b = clamp((v&255)+amt,0,255);
  return "rgb("+r+","+g+","+b+")";
}

var SPEC = { tree:{w:820,h:2500}, pole:{w:110,h:2700}, sign:{w:900,h:1500},
             box:{w:260,h:820}, cone:{w:200,h:420}, limit:{w:900,h:2100} };
function atSeg(s, x, K){
  var sc = s.p1.screen.scale;
  return { sc:sc, sx: s.p1.screen.x + sc * x * K, sy: s.p1.screen.y };
}
function drawSprite(s, sp, K){
  var o = atSeg(s, sp.x, K);
  if(!isFinite(o.sc) || o.sc <= 0) return;
  var spec = SPEC[sp.t], dw = o.sc * spec.w * K, dh = o.sc * spec.h * K;
  if(dw < 0.6 || dh < 0.6) return;
  var dx = o.sx, dy = o.sy;
  if(dx + dw < -20 || dx - dw > W + 20) return;
  if(sp.x > 0 && sp.x < rightEdge(s) + 260) return;   /* would be standing in the road */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.15, s.fog);
  if(sp.t === "tree"){
    ctx.fillStyle = "#4a3726";
    ctx.fillRect(dx - dw*0.09, dy - dh*0.26, dw*0.18, dh*0.26);
    ctx.fillStyle = "#2f6b33";
    for(var i=0;i<3;i++){
      var top = dy - dh*(0.32 + i*0.22), hh = dh*0.34, ww = dw*(0.5 - i*0.11);
      ctx.beginPath(); ctx.moveTo(dx, top - hh);
      ctx.lineTo(dx + ww, top); ctx.lineTo(dx - ww, top); ctx.closePath(); ctx.fill();
    }
  } else if(sp.t === "pole"){
    ctx.fillStyle = "#6c6255";
    ctx.fillRect(dx - dw/2, dy - dh, dw, dh);
    ctx.fillRect(dx - dw*2.4, dy - dh, dw*4.8, Math.max(1, dh*0.055));
  } else if(sp.t === "sign"){
    ctx.fillStyle = "#6c6255";
    ctx.fillRect(dx - dw*0.045, dy - dh*0.72, Math.max(1, dw*0.09), dh*0.72);
    ctx.fillStyle = COL["--sign"];
    ctx.fillRect(dx - dw/2, dy - dh, dw, dh*0.34);
    ctx.fillStyle = "#eef2ee";
    ctx.fillRect(dx - dw*0.40, dy - dh*0.90, dw*0.52, Math.max(1, dh*0.05));
    ctx.fillRect(dx - dw*0.40, dy - dh*0.78, dw*0.34, Math.max(1, dh*0.05));
  } else if(sp.t === "box"){
    ctx.fillStyle = "#8c8578";
    ctx.fillRect(dx - dw*0.08, dy - dh*0.62, Math.max(1, dw*0.16), dh*0.62);
    ctx.fillStyle = "#b8412f";
    ctx.fillRect(dx - dw/2, dy - dh, dw, dh*0.4);
  } else if(sp.t === "limit"){
    ctx.fillStyle = "#6c6255";
    ctx.fillRect(dx - dw*0.045, dy - dh*0.62, Math.max(1, dw*0.09), dh*0.62);
    ctx.fillStyle = "#f4f4f2";
    roundRect(dx - dw*0.34, dy - dh, dw*0.68, dh*0.44, dw*0.04); ctx.fill();
    ctx.strokeStyle = "#1b1c1f"; ctx.lineWidth = Math.max(0.6, dw*0.035);
    roundRect(dx - dw*0.30, dy - dh*0.965, dw*0.60, dh*0.37, dw*0.03); ctx.stroke();
    if(dw > 26){
      ctx.fillStyle = "#1b1c1f"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = "700 " + (dh*0.085).toFixed(1) + 'px "Overpass", Arial, sans-serif';
      ctx.fillText("SPEED", dx, dy - dh*0.885);
      ctx.fillText("LIMIT", dx, dy - dh*0.805);
      ctx.font = "900 " + (dh*0.21).toFixed(1) + 'px "Overpass", Arial, sans-serif';
      ctx.fillText(String(sp.n), dx, dy - dh*0.685);
    }
  } else if(sp.t === "cone"){
    ctx.fillStyle = "#e2622c";
    ctx.beginPath(); ctx.moveTo(dx, dy - dh);
    ctx.lineTo(dx + dw*0.5, dy); ctx.lineTo(dx - dw*0.5, dy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f2f2f2";
    ctx.fillRect(dx - dw*0.30, dy - dh*0.58, dw*0.60, Math.max(1, dh*0.14));
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawCar(s, car, K){
  var pct = clamp((car.z - s.p1.world.z) / SEG_LEN, 0, 1);
  var sc = lerp(s.p1.screen.scale, s.p2.screen.scale, pct);
  if(!isFinite(sc) || sc <= 0) return;
  var sx = lerp(s.p1.screen.x, s.p2.screen.x, pct);
  var sy = lerp(s.p1.screen.y, s.p2.screen.y, pct);
  var w = sc * CAR_W * K, h = sc * CAR_H * K;
  if(w < 1.2) return;
  var x = sx + sc * car.x * K, y = sy;
  if(x + w < -20 || x - w > W + 20) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.15, s.fog);
  var l = x - w/2, t = y - h;
  ctx.globalAlpha *= 0.85; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(x, y, w*0.52, h*0.10, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = Math.max(0.15, s.fog);
  ctx.fillStyle = "#16181c";
  ctx.fillRect(l + w*0.04, y - h*0.20, w*0.16, h*0.20);
  ctx.fillRect(l + w*0.80, y - h*0.20, w*0.16, h*0.20);
  ctx.fillStyle = car.color;
  roundRect(l, t, w, h*0.92, w*0.10); ctx.fill();
  ctx.fillStyle = "rgba(20,30,38,.85)";
  roundRect(l + w*0.13, t + h*0.12, w*0.74, h*0.34, w*0.05); ctx.fill();
  if(car.dir < 0){
    /* coming at you: headlights and a grille, no brake lamps */
    ctx.fillStyle = "#fff6d8";
    roundRect(l + w*0.05, t + h*0.60, w*0.22, h*0.16, w*0.05); ctx.fill();
    roundRect(l + w*0.73, t + h*0.60, w*0.22, h*0.16, w*0.05); ctx.fill();
    if(w > 8){
      ctx.globalAlpha *= 0.30; ctx.fillStyle = "#fff6d8";
      ctx.beginPath(); ctx.ellipse(l + w*0.16, t + h*0.68, w*0.42, h*0.34, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(l + w*0.84, t + h*0.68, w*0.42, h*0.34, 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = Math.max(0.15, s.fog);
    }
    ctx.fillStyle = "#31353b";
    ctx.fillRect(l + w*0.30, t + h*0.63, w*0.40, h*0.10);
  } else {
    ctx.fillStyle = car.braking ? "#ff3b24" : "#7e241c";
    roundRect(l + w*0.06, t + h*0.60, w*0.20, h*0.16, w*0.04); ctx.fill();
    roundRect(l + w*0.74, t + h*0.60, w*0.20, h*0.16, w*0.04); ctx.fill();
    if(car.braking && w > 8){
      ctx.globalAlpha *= 0.45; ctx.fillStyle = "#ff3b24";
      ctx.beginPath(); ctx.ellipse(l + w*0.16, t + h*0.68, w*0.30, h*0.26, 0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(l + w*0.84, t + h*0.68, w*0.30, h*0.26, 0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = Math.max(0.15, s.fog);
    }
  }
  if(car.signal !== 0 && Math.sin(tAcc * 18) > 0){
    ctx.fillStyle = "#ffb020";
    var sxp = car.signal > 0 ? (l + w*0.76) : (l + w*0.04);
    roundRect(sxp, t + h*0.60, w*0.20, h*0.16, w*0.04); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawHole(s, ho, K){
