  var pct = clamp((ho.z - s.p1.world.z) / SEG_LEN, 0, 1);
  var sc = lerp(s.p1.screen.scale, s.p2.screen.scale, pct);
  if(!isFinite(sc) || sc <= 0) return;
  var sx = lerp(s.p1.screen.x, s.p2.screen.x, pct);
  var sy = lerp(s.p1.screen.y, s.p2.screen.y, pct);
  var w = sc * ho.r * K, h = w * 0.30;
  if(w < 1) return;
  var x = sx + sc * ho.x * K;
  if(x + w < -20 || x - w > W + 20) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.2, s.fog);
  ctx.fillStyle = "#3b3f45";
  ctx.beginPath(); ctx.ellipse(x, sy, w, h, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#23262b";
  ctx.beginPath(); ctx.ellipse(x - w*0.08, sy - h*0.12, w*0.74, h*0.66, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}
function drawPed(s, p, K){
  var pct = clamp((p.z - s.p1.world.z) / SEG_LEN, 0, 1);
  var sc = lerp(s.p1.screen.scale, s.p2.screen.scale, pct);
  if(!isFinite(sc) || sc <= 0) return;
  var sx = lerp(s.p1.screen.x, s.p2.screen.x, pct);
  var sy = lerp(s.p1.screen.y, s.p2.screen.y, pct);
  var w = sc * 320 * K, h = sc * 900 * K;
  if(w < 0.8) return;
  var x = sx + sc * p.x * K, y = sy;
  if(x + w < -20 || x - w > W + 20) return;
  var swing = Math.sin(tAcc * (p.scram > 0 ? 18 : 7) + p.phase) * w * 0.32;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.2, s.fog);
  ctx.fillStyle = "rgba(0,0,0,.24)";
  ctx.beginPath(); ctx.ellipse(x, y, w*0.55, h*0.045, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "#2b2f36"; ctx.lineWidth = Math.max(1, w*0.20); ctx.lineCap = "round";
  ctx.beginPath();                                        /* legs */
  ctx.moveTo(x - swing, y); ctx.lineTo(x, y - h*0.42);
  ctx.moveTo(x + swing, y); ctx.lineTo(x, y - h*0.42); ctx.stroke();
  ctx.fillStyle = p.scram > 0 ? "#e4573d" : "#d9534f";
  roundRect(x - w*0.30, y - h*0.80, w*0.60, h*0.40, w*0.16); ctx.fill();
  ctx.fillStyle = "#e8c39a";
  ctx.beginPath(); ctx.arc(x, y - h*0.90, w*0.26, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1; ctx.restore();
}

function drawCrossing(s, X, K){
  var sc = s.p1.screen.scale;
  if(!isFinite(sc) || sc <= 0) return;
  var sy = s.p1.screen.y, sx = s.p1.screen.x, hw = s.halfW, rw2 = rightEdge(s);
  var railY = sy;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.2, s.fog);
  /* rails across the road */
  ctx.fillStyle = "#5a5145";
  var rwL = sc * (hw + 2600) * K, rwR = sc * (rw2 + 2600) * K,
      rh = Math.max(1, sc * 230 * K);
  ctx.fillRect(sx - rwL, railY - rh*1.7, rwL + rwR, rh);
  ctx.fillRect(sx - rwL, railY + rh*0.5,  rwL + rwR, rh);
  /* a train, when one is actually coming through */
  if(X.state === "down"){
    var tw = sc * 5200 * K, th = sc * 2600 * K;
    var tx = sx + sc * X.trainX * K;
    if(tw > 1){
      ctx.fillStyle = "#3a4048";
      roundRect(tx - tw/2, railY - th, tw, th, th*0.12); ctx.fill();
      ctx.fillStyle = "#8c1f16";
      ctx.fillRect(tx - tw/2, railY - th*0.28, tw, th*0.14);
      ctx.fillStyle = "rgba(160,200,230,.75)";
      for(var w2=0; w2<6; w2++) ctx.fillRect(tx - tw*0.44 + w2*tw*0.15, railY - th*0.80, tw*0.09, th*0.24);
    }
  }
  /* crossbuck and gate, both sides */
  for(var sgn=-1; sgn<=1; sgn+=2){
    /* the right-hand post and gate clear the apron when one is carved */
    var reach = sgn > 0 ? rw2 + 500 : hw + 500;
    var px = sx + sc * reach * sgn * K;
    var ph = sc * 2600 * K, pw = Math.max(1, sc * 150 * K);
    ctx.fillStyle = "#6c6255";
    ctx.fillRect(px - pw/2, sy - ph, pw, ph);
    var lampOn = X.state === "down" && Math.sin(tAcc*7 + sgn) > 0;
    ctx.fillStyle = lampOn ? "#ff3b24" : "#5e2a24";
    ctx.beginPath(); ctx.arc(px, sy - ph*0.92, Math.max(0.8, pw*1.5), 0, Math.PI*2); ctx.fill();
    if(X.state === "down"){
      var gl = sc * ((sgn > 0 ? rw2 : hw) + 400) * K;
      ctx.fillStyle = "#e6e2da";
      ctx.fillRect(px - (sgn > 0 ? gl : 0), sy - ph*0.42, gl, Math.max(1, ph*0.05));
      ctx.fillStyle = "#c0392b";
      for(var b3=0;b3<4;b3++)
        ctx.fillRect(px - (sgn > 0 ? gl : 0) + b3*gl*0.25 + gl*0.06, sy - ph*0.42, gl*0.12, Math.max(1, ph*0.05));
    }
  }
  ctx.globalAlpha = 1; ctx.restore();
}
function drawLight(s, L, K){
  /* rightEdge, not halfW: where a fork has carved an exit apron the pole
     belongs outside it, not planted in the exit lane */
  var o = atSeg(s, rightEdge(s) + 500, K);
  if(!isFinite(o.sc) || o.sc <= 0) return;
  var pw = o.sc * 150 * K, ph = o.sc * 3200 * K;
  if(pw < 0.5) return;
  var x = o.sx, y = o.sy;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, Math.max(0, s.clip)); ctx.clip();
  ctx.globalAlpha = Math.max(0.2, s.fog);
  ctx.fillStyle = "#4e5359";
  ctx.fillRect(x - pw/2, y - ph, pw, ph);
  var armW = o.sc * (rightEdge(s) + s.halfW*0.5 + 300) * K;
  ctx.fillRect(x - armW, y - ph, armW, Math.max(1, ph*0.035));
  var hx = x - armW*0.72, hw = o.sc * 380 * K, hh = o.sc * 1000 * K;
  ctx.fillStyle = "#23272c";
  roundRect(hx - hw/2, y - ph, hw, hh, hw*0.2); ctx.fill();
  var lamps = ["#c0392b","#d8a23c","#4caf50"], on = L.state==="red"?0:(L.state==="amber"?1:2);
  for(var i=0;i<3;i++){
    ctx.fillStyle = i === on ? lamps[i] : "rgba(255,255,255,.10)";
    ctx.beginPath();
    ctx.arc(hx, y - ph + hh*(0.22 + i*0.28), Math.max(0.6, hw*0.28), 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function drawBus(K){
  var sc = camDepth() / P.camDist;
  var bw = sc * BUS_W * K, bh = sc * BUS_H * K;
  if(bw < 4 || bh < 4) return;
  var spd = speed / maxSpeed();
  var jost = 1 + rowdy * 2.2;
  var bob = Math.sin(tAcc * 11) * (0.5 + spd * 2.6) * jost
          + Math.sin(tAcc * 4.3) * (0.35 + spd * 0.9) * jost
          + (rowdy > 0.35 ? Math.sin(tAcc * 23.7) * (rowdy - 0.35) * 5 : 0);
  var lean = steerVis * bw * 0.035;
  var x = W/2 + lean, y = H * BUS_ANCHOR + bob;
  var l = x - bw/2, t = y - bh, r = x + bw/2;
  ctx.save();
  ctx.globalAlpha = 0.28; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(x, y + bh*0.025, bw*0.55, bh*0.055, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#18191c";
  ctx.fillRect(l + bw*0.045, y - bh*0.115, bw*0.15, bh*0.13);
  ctx.fillRect(r - bw*0.195, y - bh*0.115, bw*0.15, bh*0.13);
  ctx.fillStyle = COL["--body"];
  roundRect(l, t, bw, bh*0.93, bw*0.045); ctx.fill();
  var grime = ctx.createLinearGradient(0, t, 0, t + bh*0.93);
  grime.addColorStop(0,    "rgba(150,140,110,0)");
  grime.addColorStop(0.62, "rgba(132,122,92,.10)");
  grime.addColorStop(1,    "rgba(104,95,70,.34)");
  ctx.fillStyle = grime;
  roundRect(l, t, bw, bh*0.93, bw*0.045); ctx.fill();
  ctx.fillStyle = "rgba(96,88,64,.22)";
  for(var gi=0; gi<5; gi++){
    var gx = l + bw*(0.10 + gi*0.19);
    ctx.fillRect(gx, t + bh*(0.58 + (gi%2)*0.06), bw*0.035, bh*(0.30 - (gi%2)*0.05));
  }
  ctx.fillStyle = COL["--body-mid"];
  roundRect(l + bw*0.02, t, bw*0.96, bh*0.062, bw*0.03); ctx.fill();
  ctx.fillStyle = "#2b3a44";
  roundRect(l + bw*0.145, t + bh*0.115, bw*0.71, bh*0.285, bw*0.025); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.14)";
  roundRect(l + bw*0.145, t + bh*0.115, bw*0.71, bh*0.10, bw*0.025); ctx.fill();
  ctx.fillStyle = COL["--body-text"];
  ctx.fillRect(l + bw*0.02, t + bh*0.455, bw*0.96, Math.max(1, bh*0.03));
  if(bw > 90){
    ctx.font = "800 " + Math.max(7, bw*0.082) + 'px "Overpass", Arial, sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("SCHOOL BUS", x, t + bh*0.545);
  }
  var lit = brakePedal > 0.06;
  ctx.fillStyle = lit ? "#ff3b24" : "#8e2a20";
  roundRect(l + bw*0.055, t + bh*0.63, bw*0.115, bh*0.10, bw*0.018); ctx.fill();
  roundRect(r - bw*0.17,  t + bh*0.63, bw*0.115, bh*0.10, bw*0.018); ctx.fill();
  if(lit){
    ctx.globalAlpha = 0.30 * Math.min(1, brakePedal*1.4); ctx.fillStyle = "#ff3b24";
    ctx.beginPath(); ctx.ellipse(l + bw*0.112, t + bh*0.68, bw*0.15, bh*0.11, 0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r - bw*0.112, t + bh*0.68, bw*0.15, bh*0.11, 0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#e08b12";
  for(var i=0;i<4;i++) ctx.fillRect(l + bw*(0.20 + i*0.20), t + bh*0.018, bw*0.04, Math.max(1, bh*0.018));
  ctx.fillStyle = "#2c2e33";
  ctx.fillRect(l + bw*0.015, t + bh*0.80, bw*0.97, bh*0.065);
  ctx.fillStyle = "#cfd3cb";
  ctx.fillRect(x - bw*0.075, t + bh*0.815, bw*0.15, Math.max(1, bh*0.038));
  ctx.fillStyle = "#c0392b";
  ctx.fillRect(l - bw*0.03, t + bh*0.27, Math.max(1, bw*0.06), bh*0.16);
  drawKids(l, r, t, bw, bh);
  ctx.restore();
}

function tri(x, y, up, size, color, alpha){
  ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath();
  if(up){ ctx.moveTo(x, y - size); ctx.lineTo(x + size*0.8, y); ctx.lineTo(x - size*0.8, y); }
  else  { ctx.moveTo(x, y + size); ctx.lineTo(x + size*0.8, y); ctx.lineTo(x - size*0.8, y); }
  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
}
/* Rate arrows: how many, which way, how urgently. They march along the tube so
   a glance tells you the direction of travel without reading a number. */
function rateArrows(x, yTop, yBot, n, up, color){
  n = Math.min(3, Math.round(n));
  if(n <= 0) return;
  var march = (tAcc * 34) % 16;
  for(var i=0;i<n;i++){
    var t = i * 16 + march;
    var y = up ? (yBot - t) : (yTop + t);
    if(y < yTop - 2 || y > yBot + 2) continue;
    tri(x, y, up, 7.5, color, 0.95 - i*0.22);
  }
}

/* The back of the bus, made visible. Nothing at CALM; by FERAL there are four
   of them out the windows on both sides, waving and throwing things. */
function drawKids(l, r, t, bw, bh){
  if(rowdy < 0.14 || bw < 26) return;
  var n = rowdy < 0.30 ? 1 : rowdy < 0.52 ? 2 : rowdy < 0.74 ? 3 : 4;
  var wild = 0.5 + rowdy * 2.4;
  var skin = ["#e8c39a","#c98e63","#f0d2b0","#a9714a"];
  var shirt = ["#d9534f","#3f7fa8","#6fa85a","#c9a13c"];
  for(var i=0;i<n;i++){
    var side = (i % 2 === 0) ? -1 : 1;
    var k = Math.floor(i/2);
    var px = (side < 0 ? l : r) + side * bw * (0.055 + k*0.035);
    var py = t + bh * (0.20 + k*0.13);
    var ph = (tAcc * (3.4 + i*1.3) + i*2.1);
    var lean = (0.55 + rowdy*0.75) * bw * 0.055;
    var bobY = Math.sin(ph*wild) * bh * 0.012 * wild;
    var hr = bw * 0.048;
    ctx.strokeStyle = skin[i % skin.length];
    ctx.lineWidth = Math.max(1, bw*0.026); ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(px, py + bobY);
    ctx.lineTo(px + side*lean*1.5, py + bobY - bh*0.055 + Math.sin(ph*wild*1.7)*bh*0.045*wild);
    ctx.stroke();
    ctx.fillStyle = shirt[i % shirt.length];
    roundRect(px + side*lean*0.25 - bw*0.035, py + bobY - bh*0.005, bw*0.07, bh*0.055, bw*0.02);
    ctx.fill();
    ctx.fillStyle = skin[i % skin.length];
    ctx.beginPath();
    ctx.arc(px + side*lean*0.45, py + bobY - bh*0.022, hr, 0, Math.PI*2);
    ctx.fill();
    if(rowdy > 0.78 && ((i + Math.floor(tAcc*1.3)) % 4 === 0)){
      var tp = (tAcc*1.3) % 1;
      ctx.fillStyle = "#f2f2f2";
      ctx.beginPath();
      ctx.arc(px + side*(lean*1.5 + tp*bw*0.5), py - bh*0.09 - tp*bh*0.16 + tp*tp*bh*0.2,
              Math.max(1, bw*0.016), 0, Math.PI*2);
      ctx.fill();
    }
  }
}

/* The same keycap the DOM uses, drawn on canvas, so a key named on an
   instrument looks like a key named in an advisory. Square unless the label
   is too long for it. */
function drawKeycap(cx, cy, label, size, lit){
  var one = label.length <= 1, w = one ? size : size*0.62 + label.length*size*0.56,
      h = size, x = cx - w/2, y = cy - h/2;
  ctx.save();
  ctx.fillStyle = "#0d1526";
  roundRect(x - 2, y - 2, w + 4, h + 4 + 4, 4); ctx.fill();
  ctx.fillStyle = "#b8801a";
  roundRect(x, y + 4, w, h, 3); ctx.fill();
  ctx.fillStyle = lit ? "#9be36a" : "#ffd23f";
  roundRect(x, y, w, h, 3); ctx.fill();
  ctx.fillStyle = "#20140a";
  ctx.font = '400 ' + Math.round(size*0.56) + 'px ' + PXF;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, cx, cy + 1);
  ctx.restore();
  return w;
}
/* A speed limit sign, the thing you actually read at the roadside. */
function drawLimitSign(cx, cy, w, limit){
  var h = w * 1.28, x = cx - w/2, y = cy - h/2;
  ctx.save();
  ctx.fillStyle = "rgba(10,13,16,.55)";
  roundRect(x + 3, y + 4, w, h, 4); ctx.fill();
  ctx.fillStyle = "#f4f2ec";
  roundRect(x, y, w, h, 4); ctx.fill();
  ctx.strokeStyle = "#16181c"; ctx.lineWidth = Math.max(2, w*0.055);
  roundRect(x + w*0.05, y + h*0.04, w*0.90, h*0.92, 3); ctx.stroke();
  ctx.fillStyle = "#16181c";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = '800 ' + Math.round(w*0.155) + 'px "Overpass", Arial, sans-serif';
  ctx.fillText("SPEED", cx, y + h*0.17);
  ctx.fillText("LIMIT", cx, y + h*0.32);
  ctx.font = '700 ' + Math.round(w*0.50) + 'px "Overpass Mono", monospace';
  ctx.fillText(String(limit), cx, y + h*0.66);
  ctx.restore();
}
function drawSpeedo(){
  var R = 126, cx = 26 + R, cy = H - 30 - R;
  var mph = speed / upm(), lim = pSeg ? ZONES[pSeg.zone].limit : 55;
  var maxM = P.maxSpeedMph, over = mph > lim + 4;

  /* Stacked above the dial: the limit sign, then the telling-off when you are
     past it. SLOW DOWN left the advisory stack because it belongs next to the
     instrument that shows the number it is about. */
  if(running){
    var signW = 76;
    drawLimitSign(cx, cy - R - 117, signW, lim);
    if(mph > lim + 8){
      var wy = cy - R - 36;
      ctx.save();
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = '900 26px "Overpass", Arial, sans-serif';
      var tw2 = ctx.measureText("SLOW DOWN").width;
      ctx.fillStyle = "rgba(150,38,24,.94)";
      roundRect(cx - tw2/2 - 16, wy - 20, tw2 + 32, 40, 5); ctx.fill();
      ctx.strokeStyle = "rgba(255,120,96,.8)"; ctx.lineWidth = 3;
      roundRect(cx - tw2/2 - 16, wy - 20, tw2 + 32, 40, 5); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.fillText("SLOW DOWN", cx, wy + 1);
      ctx.restore();
    }
  }

  ctx.save();
  if(over) ctx.translate((Math.random()-0.5)*R*0.03, (Math.random()-0.5)*R*0.03);
  ctx.fillStyle = "rgba(16,19,23,.86)";
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = R*0.045;
  ctx.strokeStyle = over && Math.sin(tAcc*15) > 0 ? "#e4573d" : "rgba(255,255,255,.16)";
  ctx.stroke();
  var A0 = Math.PI*0.75, A1 = Math.PI*2.25;
  function ang(m){ return A0 + (A1 - A0) * clamp(m / maxM, 0, 1); }
  ctx.lineWidth = R*0.12;
  ctx.strokeStyle = "rgba(127,196,90,.26)";
  ctx.beginPath(); ctx.arc(cx, cy, R*0.83, A0, ang(lim)); ctx.stroke();
  ctx.strokeStyle = over ? "rgba(228,87,61,.55)" : "rgba(228,87,61,.26)";
  ctx.beginPath(); ctx.arc(cx, cy, R*0.83, ang(lim), A1); ctx.stroke();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(var m=0; m<=maxM; m+=5){
    var a2 = ang(m), big = (m % 20 === 0);
    ctx.strokeStyle = "rgba(255,255,255," + (big ? 0.72 : 0.3) + ")";
    ctx.lineWidth = big ? R*0.018 : R*0.009;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a2)*R*0.755, cy + Math.sin(a2)*R*0.755);
    ctx.lineTo(cx + Math.cos(a2)*R*(big ? 0.62 : 0.665), cy + Math.sin(a2)*R*(big ? 0.62 : 0.665));
    ctx.stroke();
    if(big && m > 0){
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.font = '700 ' + (R*0.105).toFixed(0) + 'px "Overpass", Arial, sans-serif';
      ctx.fillText(String(m), cx + Math.cos(a2)*R*0.50, cy + Math.sin(a2)*R*0.50);
    }
  }
  var la = ang(lim);
  ctx.strokeStyle = "#f4b301"; ctx.lineWidth = R*0.038;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(la)*R*0.93, cy + Math.sin(la)*R*0.93);
  ctx.lineTo(cx + Math.cos(la)*R*0.60, cy + Math.sin(la)*R*0.60);
  ctx.stroke();
  ctx.fillStyle = "#f4b301";
  ctx.font = '800 ' + (R*0.11).toFixed(0) + 'px "Overpass Mono", monospace';
  ctx.fillText(String(lim), cx + Math.cos(la)*R*0.34, cy + Math.sin(la)*R*0.34);
  var na = ang(mph);
  ctx.strokeStyle = over ? "#e4573d" : "#eceef0";
  ctx.lineWidth = R*0.038; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(na)*R*0.14, cy - Math.sin(na)*R*0.14);
  ctx.lineTo(cx + Math.cos(na)*R*0.70, cy + Math.sin(na)*R*0.70);
  ctx.stroke();
  ctx.fillStyle = "#1b1c1f"; ctx.beginPath(); ctx.arc(cx, cy, R*0.07, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.45)"; ctx.lineWidth = R*0.012; ctx.stroke();
  ctx.fillStyle = over ? "#e4573d" : "#e9ebef";
  ctx.font = '700 ' + (R*0.28).toFixed(0) + 'px "Overpass Mono", monospace';
  ctx.fillText(Math.round(mph), cx, cy + R*0.40);
  ctx.fillStyle = "rgba(255,255,255,.42)";
  ctx.font = '700 ' + (R*0.085).toFixed(0) + 'px "Overpass", Arial, sans-serif';
  ctx.fillText("MPH", cx, cy + R*0.60);
  ctx.restore();
}

/* Top left: the fan and its six-segment charge. The charge bleeds away while
   it runs, and every smack of S puts one segment back. */
function drawFan(){
  var cx = 86, cy = 86, R = 56;
  var segs = Math.round(P.acTaps), on = acCharge > 0;
  fanAng += (on ? 13 : (Math.random() < 0.06 ? 5 : 0.12)) * 0.016;

  ctx.save();
  ctx.fillStyle = "rgba(16,19,23,.86)";
  ctx.beginPath(); ctx.arc(cx, cy, R + 11, 0, Math.PI*2); ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = on ? "rgba(111,192,232,.65)" : "rgba(228,87,61,.75)";
  ctx.stroke();
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(fanAng);
  if(!on) ctx.rotate(Math.sin(tAcc*31) * 0.06);
  ctx.fillStyle = on ? "#6fc0e8" : "#8a6f68";
  for(var i=0;i<4;i++){
    ctx.rotate(Math.PI/2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(R*0.75, -R*0.30, R*0.88, R*0.10);
    ctx.quadraticCurveTo(R*0.45, R*0.26, 0, 0);
    ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#23272c"; ctx.beginPath(); ctx.arc(cx, cy, R*0.18, 0, Math.PI*2); ctx.fill();

  /* Segment bar. Each pip gets a dark body and a black rim: pale blue on a
     pale sky was invisible, and this bar is read at a glance or not at all. */
  var bx = cx + R + 22, by = cy - 17, sw = 34, sh = 34, sgap = 6;
  var filled = on ? acCharge : acHits;
  for(var k=0;k<segs;k++){
    var x = bx + k*(sw + sgap);
    ctx.fillStyle = "rgba(10,13,16,.80)";
    roundRect(x, by, sw, sh, 5); ctx.fill();
    var lit = k < Math.floor(filled + 0.0001);
    var part = filled - k;
    if(lit || (part > 0 && part < 1)){
      ctx.fillStyle = on ? "#6fc0e8" : "#f4b301";
      var w2 = lit ? sw : sw * clamp(part, 0, 1);
      roundRect(x, by, Math.max(2, w2), sh, 5); ctx.fill();
    }
    ctx.strokeStyle = "#0b0e11"; ctx.lineWidth = 3.5;
    roundRect(x, by, sw, sh, 5); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.lineWidth = 1.2;
    roundRect(x, by, sw, sh, 5); ctx.stroke();
  }
  var barEnd = bx + segs*(sw + sgap) - sgap;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round"; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(10,13,16,.92)";
  var ly = by + sh + 24;
  if(on){
    ctx.font = '800 30px "Overpass", Arial, sans-serif';
    ctx.strokeText("A/C RUNNING", bx, ly);
    ctx.fillStyle = "#9bd6f2";
    ctx.fillText("A/C RUNNING", bx, ly);
  } else {
    ctx.font = '800 30px "Overpass", Arial, sans-serif';
    ctx.strokeText("A/C ON THE FRITZ", bx, ly);
    ctx.fillStyle = "#ff9a80";
    ctx.fillText("A/C ON THE FRITZ", bx, ly);
    var ly2 = ly + 38;
    ctx.font = '800 30px "Overpass", Arial, sans-serif';
    ctx.strokeText("TAP", bx, ly2);
    ctx.fillStyle = Math.sin(tAcc*7) > 0 ? "#ff7a5c" : "#e4573d";
    ctx.fillText("TAP", bx, ly2);
    var tw = ctx.measureText("TAP ").width;
    var kw = drawKeycap(bx + tw + 18, ly2, "S", 34, false);
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = '800 30px "Overpass", Arial, sans-serif';
    ctx.lineJoin = "round"; ctx.lineWidth = 6; ctx.strokeStyle = "rgba(10,13,16,.92)";
    ctx.strokeText("TO SMACK IT!", bx + tw + 18 + kw/2 + 16, ly2);
    ctx.fillStyle = Math.sin(tAcc*7) > 0 ? "#ff7a5c" : "#e4573d";
    ctx.fillText("TO SMACK IT!", bx + tw + 18 + kw/2 + 16, ly2);
  }

  for(var q=sparks.length-1; q>=0; q--){
    var sp = sparks[q];
    var life = sp.life || 0.45;
    sp.t -= 0.016;
    if(sp.t <= 0){ sparks.splice(q,1); continue; }
    var d = (life - sp.t) * sp.v;
    ctx.globalAlpha = Math.max(0, sp.t / life);
    ctx.fillStyle = Math.random() < 0.5 ? "#ffd27a" : "#ff8a3d";
    ctx.beginPath();
    ctx.arc(cx + Math.cos(sp.a)*d, cy + Math.sin(sp.a)*d + d*0.5,
            2.4 + (life > 1 ? 2.2 : 1.2), 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  if(!on && Math.random() < 0.06)
    sparks.push({ a: Math.random()*6.28, v: 30 + Math.random()*60, t: 0.4, life: 0.4 });
  ctx.restore();
}

/* A bladder, drawn as a bladder: it starts as a bead and swells upward from a
   fixed bottom point, shaking harder the fuller it gets. */
function drawBladder(cx, baseY, frac){
  var h = 20 + frac * 118, w = 16 + frac * 92;
  var sh = Math.pow(frac, 2.2) * 6;
  ctx.save();
  if(sh > 0.15) ctx.translate(Math.sin(tAcc*26)*sh, Math.cos(tAcc*31)*sh*0.6);
  var wob = Math.sin(tAcc*2.3) * w * 0.035 * (0.3 + frac);
  ctx.beginPath();
  ctx.moveTo(cx, baseY);
  ctx.bezierCurveTo(cx - w*0.62 - wob, baseY - h*0.14,
                    cx - w*0.58 + wob, baseY - h*0.78,
                    cx,               baseY - h);
  ctx.bezierCurveTo(cx + w*0.58 + wob, baseY - h*0.78,
                    cx + w*0.62 - wob, baseY - h*0.14,
                    cx,               baseY);
  ctx.closePath();
  ctx.fillStyle = "rgba(10,13,16,.72)";
  ctx.save(); ctx.translate(0, 3); ctx.fill(); ctx.restore();
  var g = ctx.createLinearGradient(0, baseY - h, 0, baseY);
  g.addColorStop(0, frac > 0.9 ? "#f0b93f" : "#e8b143");
  g.addColorStop(1, "#b97f22");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = frac > 0.9 ? "rgba(255,190,90,.95)" : "rgba(255,255,255,.28)";
  ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,.22)";
  ctx.beginPath();
  ctx.ellipse(cx - w*0.20, baseY - h*0.66, w*0.14, h*0.12, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawThermos(){
  var tubeH = 196, tubeW = 32, bulb = 21, gap = 104;
  var cabX = W - 62, hydX = cabX - gap, bldX = hydX - 112;
  /* high enough that the keycap and its caption clear the bottom edge */
  var by = H - 104;
  var heatF = clamp((heat - 72) / 26, 0, 2.2);
  var sweat = P.sweatFactor * heatF, thirst = P.thirstRate + sweat;
  var drinking = keys.drink, on = acCharge > 0;

  var cols = [
    { lab:"HYDRATION", val:Math.round(water), frac: water/100, x: hydX,
      col:"#4aa8d8", up: drinking ? 3 : 0, upCol:"#7fc45a",
      dn: drinking ? 0 : clamp(thirst / 1.3, 1, 3), dnCol:"#e4573d",
      key:"W", prompt:"drink", lit: drinking },
    { lab:"CABIN", val:Math.round(heat) + "\u00b0", frac: clamp((heat - 70) / 34, 0, 1), x: cabX,
      col:"#e4573d", up: on ? (heat > P.acFloor ? 0 : 1) : 3, upCol:"#e4573d",
      dn: (on && heat > P.acFloor) ? 3 : 0, dnCol:"#6fc0e8",
      key:"", prompt: on ? (heat > P.acFloor ? "cooling" : "holding") : "fan is dead",
      lit:false }
  ];

  ctx.save();
  for(var i=0;i<cols.length;i++){
    var c = cols[i], x = c.x, top = by - tubeH;
    ctx.fillStyle = "rgba(10,13,16,.72)";
    roundRect(x - tubeW/2 - 3, top - 3, tubeW + 6, tubeH + 6, tubeW/2 + 3); ctx.fill();
    ctx.beginPath(); ctx.arc(x, by + bulb - 3, bulb + 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.10)";
    roundRect(x - tubeW/2, top, tubeW, tubeH, tubeW/2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, by + bulb - 3, bulb, 0, Math.PI*2); ctx.fill();
    var fh = Math.max(3, c.frac * (tubeH - 9));
    ctx.fillStyle = c.col;
    roundRect(x - tubeW/2 + 6, by - 6 - fh, tubeW - 12, fh, (tubeW-12)/2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, by + bulb - 3, bulb - 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.font = '800 15px "Overpass", Arial, sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(c.lab, x, top - 34);
    ctx.fillStyle = "#e9ebef";
    ctx.font = '700 23px "Overpass Mono", monospace';
    ctx.fillText(c.val, x, top - 13);
    if(c.lab === "HYDRATION"){
      var ty = by - 6 - (P.topUpAt/100) * (tubeH - 9);
      ctx.strokeStyle = overFull ? "#e4573d" : "rgba(255,255,255,.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - tubeW/2 - 6, ty); ctx.lineTo(x + tubeW/2 + 6, ty); ctx.stroke();
      ctx.fillStyle = overFull ? "#e4573d" : "rgba(255,255,255,.55)";
      ctx.font = '800 10px "Overpass Mono", monospace';
      ctx.textAlign = "right";
      ctx.fillText(Math.round(P.topUpAt), x - tubeW/2 - 9, ty);
      ctx.textAlign = "center";
    }
    rateArrows(x + tubeW/2 + 13, top + 9, by - 12, c.up, true,  c.upCol);
    rateArrows(x - tubeW/2 - 13, top + 9, by - 12, c.dn, false, c.dnCol);
    var py = by + bulb*2 + 12;
    if(c.key) drawKeycap(x, py - 9, c.key, 28, c.lit);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.62)";
    ctx.font = '700 13px "Overpass", Arial, sans-serif';
    ctx.fillText(c.prompt, x, py + (c.key ? 9 : -9));
  }

  drawBladder(bldX, by + bulb + 10, bladder/100);

  /* the burst: a ring and a spray, once, at the moment it goes */
  if(bladderPop > 0){
    var pcx = bldX, pcy = by + bulb + 10 - 70;
    var ring = (1 - bladderPop) * 170;
    ctx.save();
    ctx.globalAlpha = Math.min(1, bladderPop) * 0.85;
    ctx.strokeStyle = "#f0b93f"; ctx.lineWidth = 4 + bladderPop * 9;
    ctx.beginPath(); ctx.arc(pcx, pcy, 12 + ring, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  for(var pb2 = popBits.length - 1; pb2 >= 0; pb2--){
    var bit = popBits[pb2];
    bit.t -= 0.016;
    if(bit.t <= 0){ popBits.splice(pb2, 1); continue; }
    var age = (1.4 - bit.t), dd2 = age * bit.v;
    ctx.globalAlpha = Math.max(0, Math.min(1, bit.t));
    ctx.fillStyle = "#e8b143";
    ctx.beginPath();
    ctx.arc(bldX + Math.cos(bit.a)*dd2,
            by + bulb - 60 + Math.sin(bit.a)*dd2*0.7 + age*age*150,
            bit.r, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.font = '800 15px "Overpass", Arial, sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("BLADDER", bldX, by - tubeH - 34);
  ctx.fillStyle = "#e9ebef";
  ctx.font = '700 23px "Overpass Mono", monospace';
  ctx.fillText(Math.round(bladder), bldX, by - tubeH - 13);
  ctx.fillStyle = "rgba(255,255,255,.62)";
  ctx.font = '700 13px "Overpass", Arial, sans-serif';
  ctx.fillText(hasDrunk ? "no emptying it" : "don\u2019t start yet",
               bldX, by + bulb*2 + 3);
  /* The flag that used to sit up by the rowdiness gauge belongs here, on the
     thing that actually failed. */
  if(incident){
    var fw = 176, fh = 34, fx = bldX - fw/2, fy = by + bulb*2 + 16;
    ctx.fillStyle = "rgba(16,19,23,.92)";
    roundRect(fx, fy, fw, fh, 5); ctx.fill();
    ctx.strokeStyle = "#e4573d"; ctx.lineWidth = 3;
    roundRect(fx, fy, fw, fh, 5); ctx.stroke();
    ctx.fillStyle = "#ff8a72";
    ctx.font = '900 17px "Overpass", Arial, sans-serif';
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("DIGNITY LOST", bldX, fy + fh/2 + 1);
  }

  var spawn = heat > 80 ? (0.04 + heatF * 0.30) : 0;
  if(Math.random() < spawn){
    var topC = by - tubeH;
    drips.push({ x: cabX + (Math.random()-0.5)*(tubeW + 26),
                 y: topC + Math.random()*(tubeH + bulb),
                 v: 10 + Math.random()*34, t: 1 });
  }
  for(var d=drips.length-1; d>=0; d--){
    var dr = drips[d];
    dr.y += dr.v * 0.016; dr.v += 46*0.016; dr.t -= 0.016*0.75;
    if(dr.t <= 0 || dr.y > H){ drips.splice(d,1); continue; }
    ctx.globalAlpha = Math.max(0, dr.t) * 0.8;
    ctx.fillStyle = "#6fc0e8";
    ctx.beginPath(); ctx.ellipse(dr.x, dr.y, 3, 4.8, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function render(){
  var cd = camDepth(), K = scaleK();
  var pitch = ((cd / P.camDist) * P.camHeight * K) - (H * BUS_ANCHOR - H/2);
  var horizon = H/2 - pitch;
  var baseIdx = clamp(Math.floor(position / SEG_LEN), 0, segments.length-1);
  var base = segments[baseIdx];
  var basePct = (((position % SEG_LEN) + SEG_LEN) % SEG_LEN) / SEG_LEN;
  var shake = (rowdy > 0.5 ? (rowdy - 0.5) * 5 : 0) + (jolt > 0 ? jolt * 26 : 0);
  ctx.save();
  if(shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  /* Lightheaded: the world sways and doubles rather than going dark. You can
     still see the road, you just can't trust where it is. */
  if(dim > 0.01){
    var sway = dim * P.woozyAmp;
    ctx.translate(W/2, H/2);
    ctx.rotate(Math.sin(tAcc * 1.15) * 0.030 * sway);
    ctx.scale(1 + Math.sin(tAcc * 0.83) * 0.030 * sway, 1 + Math.sin(tAcc * 1.02) * 0.026 * sway);
    ctx.translate(-W/2 + Math.sin(tAcc * 0.61) * 22 * sway, -H/2 + Math.cos(tAcc * 0.74) * 14 * sway);
  }
  backdrop(horizon);

  var n, s, i;
  for(n=0; n<DRAW_DIST; n++){ s = segments[baseIdx+n]; if(s) s.cars.length = 0; }
  for(i=0;i<cars.length;i++){
    if(!cars[i].active) continue;
    var ci = Math.floor(cars[i].z / SEG_LEN);
    if(ci >= baseIdx && ci < baseIdx + DRAW_DIST && segments[ci]) segments[ci].cars.push(cars[i]);
  }

  var maxy = H, x = 0, dx = -(base.curve * basePct);
  for(n=0; n<DRAW_DIST; n++){
    s = segments[baseIdx + n];
    if(!s) break;
    var d = n / DRAW_DIST;
    s.fog = 1 / Math.pow(Math.E, d * d * FOG_DENSITY);
    s.clip = maxy;
    project(s.p1, busX - x,      playerY + P.camHeight, position, cd, K, pitch, s.halfW);
    project(s.p2, busX - x - dx, playerY + P.camHeight, position, cd, K, pitch, s.halfW);
    s.p1.screen.ew = s.exitW ? s.p1.screen.scale * s.exitW * K : 0;
    s.p2.screen.ew = s.exitW ? s.p2.screen.scale * s.exitW * K : 0;
    s.p1.screen.gw = s.exitW ? s.p1.screen.scale * (s.exitGap || 0) * K : 0;
    s.p2.screen.gw = s.exitW ? s.p2.screen.scale * (s.exitGap || 0) * K : 0;
    x += dx; dx += s.curve;
    if(s.p1.camera.z <= cd || s.p2.screen.y >= s.p1.screen.y || s.p2.screen.y >= maxy) continue;
    renderSegment(s);
    maxy = s.p2.screen.y;
  }
  for(n=DRAW_DIST-1; n>0; n--){
    s = segments[baseIdx + n];
    if(!s) continue;
    for(i=0;i<s.sprites.length;i++) drawSprite(s, s.sprites[i], K);
    for(i=0;i<s.cars.length;i++)    drawCar(s, s.cars[i], K);
  }
  for(i=0;i<holes.length;i++){
    var hi2 = holes[i].idx;
    if(hi2 > baseIdx && hi2 < baseIdx + DRAW_DIST && segments[hi2] && segments[hi2].p1.screen.w)
      drawHole(segments[hi2], holes[i], K);
  }
  /* pedestrians and lights are sparse; find their segment directly */
  for(i=0;i<peds.length;i++){
    var pi = Math.floor(peds[i].z / SEG_LEN);
    if(pi > baseIdx && pi < baseIdx + DRAW_DIST && segments[pi] && segments[pi].p1.screen.w)
      drawPed(segments[pi], peds[i], K);
  }
  for(i=0;i<crossings.length;i++){
    var xi2 = crossings[i].idx;
    if(xi2 > baseIdx && xi2 < baseIdx + DRAW_DIST && segments[xi2] && segments[xi2].p1.screen.w)
      drawCrossing(segments[xi2], crossings[i], K);
  }
  for(i=0;i<lights.length;i++){
    var li = lights[i].idx;
    if(li > baseIdx && li < baseIdx + DRAW_DIST && segments[li] && segments[li].p1.screen.w)
      drawLight(segments[li], lights[i], K);
  }
  drawBus(K);
  ctx.restore();

  if(dim > 0.01){
    /* a doubled, lagging copy of the frame - cheap, and reads as swimming */
    var g3 = dim * P.woozyAmp;
    ctx.globalAlpha = Math.min(0.5, 0.42 * g3);
    ctx.drawImage(cv, Math.sin(tAcc * 2.3) * 16 * g3, Math.cos(tAcc * 1.9) * 11 * g3, W, H);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(196,150,70," + Math.min(0.24, 0.20 * g3).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.save();
  drawSpeedo();
  drawThermos();
  drawFan();

  ctx.restore();
}

/* ---------------- sound ----------------
   Plain Audio elements, one per loop and a small pool per one-shot so that
   three yells or two potholes can overlap without cutting each other off.
   Nothing plays until the first key or click, because browsers will not let
   it, and the first key is also the key that starts the run. */
var PXF = '"Press Start 2P","Overpass Mono",monospace';
var SND = {
  engine:  { src:"snd/bus-engine.mp3",     loop:true },
  music:   { src:"snd/music-loop.mp3",     loop:true },
  crowd:   { src:"snd/people-ambient.mp3", loop:true },
  fan:     { src:"snd/fan-blowing.mp3",    loop:true, g:0.45 },
  fanDies: { src:"snd/fan-breaking.mp3",  g:0.95, pool:2 },
  horn:    { src:"snd/bus-horn-1.mp3",    g:0.85, pool:3 },
  brake:   { src:"snd/car-braking.mp3",   g:0.55, pool:3 },
  pothole: { src:"snd/pothole.mp3",       g:0.90, pool:3 },
  slap:    { src:"snd/slap-fan.mp3",      g:1.00, pool:3 },
  incident:{ src:"snd/the-incident.mp3",  g:1.00, pool:1 },
  crossing:{ src:"snd/train-crossing.mp3", loop:true }
};
/* The yells come out of a shuffled bag rather than in order, so a cluster of
   three is three different people. A clip only comes round again once the bag
   is empty, and the one just used is held back from the refill so the bag
   turning over never lands the same yell twice in a row. */
var YELLS = 9, yellBag = [], lastYell = -1;
for(var yi = 1; yi <= YELLS; yi++) SND["yell" + yi] = { src:"snd/yell" + yi + ".mp3", g:0.90, pool:2 };
function nextYell(){
  if(!yellBag.length)
    for(var i = 1; i <= YELLS; i++) yellBag.push(i);
  var k = Math.floor(Math.random() * yellBag.length);
  /* step off the one just used rather than dropping it from the refill -
     holding it back cost it a whole cycle and made it the rarest voice */
  if(yellBag[k] === lastYell && yellBag.length > 1) k = (k + 1) % yellBag.length;
  lastYell = yellBag.splice(k, 1)[0];
  return "yell" + lastYell;
}
var A = {}, audioOn = true, audioBuilt = false, brakeCool = 0, prevFanOn = true;
function buildAudio(){
  if(audioBuilt) return; audioBuilt = true;
  for(var k in SND){
    if(!SND.hasOwnProperty(k)) continue;
    var d = SND[k], n = d.loop ? 1 : (d.pool || 1), arr = [];
    for(var i=0;i<n;i++){
      var a = new Audio(d.src);
      a.preload = "auto"; a.loop = !!d.loop;
      arr.push(a);
    }
    A[k] = { d:d, pool:arr, i:0, on:false };
  }
}
function lvl(k){
  if(k === "engine") return clamp(P.volEngine, 0, 1);
  if(k === "music")  return clamp(P.volMusic, 0, 1);
  if(k === "crowd")  return clamp(P.volCrowdLo, 0, 1);
  return clamp((SND[k].g || 1) * P.volSfx, 0, 1);
}
/* one-shot */
function play(k, gain){
  if(!audioOn || !A[k]) return;
  var g = A[k], a = g.pool[(g.i++) % g.pool.length];
  try{
    a.currentTime = 0;
    a.volume = clamp(lvl(k) * (gain == null ? 1 : gain), 0, 1);
    var pr = a.play(); if(pr && pr.catch) pr.catch(function(){});
  }catch(e){}
}
function loopOn(k, vol){
  if(!A[k]) return;
  var g = A[k], a = g.pool[0];
  a.volume = clamp(vol == null ? lvl(k) : vol, 0, 1);
  if(!audioOn){ loopOff(k); return; }
  if(!g.on){ g.on = true; var pr = a.play(); if(pr && pr.catch) pr.catch(function(){ g.on = false; }); }
}
function loopOff(k){
  var g = A[k]; if(!g || !g.on) return;
  g.on = false; try{ g.pool[0].pause(); }catch(e){}
}
/* The engine, the radio and the kids never stop; the fan comes and goes. */
function startBeds(){
  buildAudio();
  loopOn("engine"); loopOn("music"); loopOn("crowd");
  if(acCharge > 0) loopOn("fan");
}
/* The crossing bell belongs to the crossing, not to the bus: it swells as you
   come up on it and is gone a moment after you are past. */
function crossingSound(){
  var best = 0, bz = busZ();
  for(var i=0;i<crossings.length;i++){
    var X = crossings[i];
    if(X.state !== "down") continue;
    var dz = X.z - bz;
    var v = dz >= 0 ? clamp(1 - (dz - 1400) / 13000, 0, 1)   /* heard from ~14k out */
                    : clamp(1 + dz / 2600, 0, 1);            /* gone 2.6k past it */
    if(v > best) best = v;
  }
  if(best > 0.02) loopOn("crossing", clamp(best * P.volSfx, 0, 1));
  else loopOff("crossing");
}
function audioTick(){
  if(!audioBuilt) return;
  crossingSound();
  loopOn("crowd", clamp(P.volCrowdLo + (P.volCrowdHi - P.volCrowdLo) * rowdy, 0, 1));
  loopOn("engine"); loopOn("music");
  var fanOn = acCharge > 0;
  if(fanOn) loopOn("fan"); else loopOff("fan");
  if(prevFanOn && !fanOn) play("fanDies");
  prevFanOn = fanOn;
}
function toggleMute(){
  audioOn = !audioOn;
  if(audioOn) startBeds();
  else { loopOff("engine"); loopOff("music"); loopOff("crowd"); loopOff("fan"); loopOff("crossing"); }
  var m = document.getElementById("c-mute"); if(m) m.hidden = audioOn;
}

/* ---------------- HUD ---------------- */
var E = {};
["g-clock","clock","prog-fill","prog-bus","g-rowdy","g-rowdybar","gw-rowdy",
 "c-mute","thirsty","wild","ri-horn","ri-speed","ri-fan"].forEach(function(id){ E[id] = document.getElementById(id); });

/* Are we legitimately waiting for something? */
function heldAtSignal(){
  var bz = busZ(), i;
  for(i=0;i<lights.length;i++){
    var d = lights[i].z - bz;
    if(d > -600 && d < 3200 && lights[i].state !== "green") return true;
  }
  for(i=0;i<crossings.length;i++){
    var d2 = crossings[i].z - bz;
    if(d2 > -600 && d2 < 3800 && crossings[i].state === "down") return true;
  }
  return false;
}
function gateAhead(){
  var bz = busZ();
  for(var i=0;i<crossings.length;i++){
    var d = crossings[i].z - bz;
    if(d > 200 && d < 11000 && crossings[i].state === "down") return true;
  }
  return false;
}
function redAhead(){
  var bz = busZ();
  for(var i=0;i<lights.length;i++){
    var d = lights[i].z - bz;
    if(d > 300 && d < 9000 && lights[i].state !== "green") return true;
  }
  return false;
}
function cutterAhead(){
  var bz = busZ();
  for(var i=0;i<cars.length;i++){
    var c = cars[i];
    if(!c.active || c.dir < 0) continue;
    if((c.stage === "merge" || c.stage === "brake") && Math.abs(c.x - busX) < SEE_X){
      var d = c.z - bz;
      if(d > 0 && d < 6500) return true;
    }
  }
  return false;
}
/* Every advisory names the thing going wrong AND the key that fixes it.
   Ranked, top three only, so the screen never becomes a wall of text. */
/* Only road hazards that need a reaction right now. Heat, hydration, bladder
   and speed all live on the instruments, so they no longer shout here - there
   is no time to read a sentence while driving. */
function KC(label, wide){ return '<b class="kc' + (wide ? " w" : "") + '">' + label + '</b>'; }
function advisories(){
  var out = [];
  if(!running) return out;
  /* Each entry is [priority, hot, first line, second line as HTML].
     Several advisories have left this stack for the instrument they belong to:
     thirst sits on the meters, SLOW DOWN above the speedometer, KIDS GOING
     WILD under the rowdiness gauge. Off-road, topping-up and "the kids are
     hot" are gone - the instruments already say all three. */
  if(gateAhead())         out.push([98, 1, "GATES DOWN", KC("\u2193")]);
  if(pedAhead())          out.push([96, 1, "PEDESTRIANS CROSSING",
                                    "SWERVE " + KC("\u2190") + KC("\u2192") + " OR HONK " + KC("SPACE", 1)]);
  if(bladder > P.swerveAt) out.push([90, 1, "YOU CAN\u2019T HOLD IT", ""]);
  if(redAhead())          out.push([88, 1, "RED LIGHT", KC("\u2193")]);
  if(cutterAhead())       out.push([84, 1, "CUT OFF!",
                                    "SWERVE " + KC("\u2190") + KC("\u2192") + " OR HONK " + KC("SPACE", 1)]);
  out.sort(function(a,b){ return b[0] - a[0]; });
  return out.slice(0, 2);
}
function pedAhead(){
  var bz = busZ();
  for(var i=0;i<peds.length;i++){
    var p = peds[i];
    if(p.done) continue;
    var dz = p.z - bz;
    if(dz > -400 && dz < 7000 && Math.abs(p.x) < segAt(p.z).halfW + 700) return true;
  }
  return false;
}
function fmtClock(sec){
  sec = Math.max(0, sec);
  var m = Math.floor(sec/60), s = Math.floor(sec%60);
  return m + ":" + (s<10 ? "0"+s : s);
}
function hud(){
  var left = P.deadline - elapsed;
  E["g-clock"].textContent = fmtClock(left);
  E["clock"].className = left < 25 ? "warn" : "";
  var prog = finishZ > 0 ? clamp(position / finishZ, 0, 1) : 0;
  E["prog-fill"].style.width = (prog * 100).toFixed(2) + "%";
  E["prog-bus"].style.left = (prog * 100).toFixed(2) + "%";

  E["g-rowdybar"].style.width = (rowdy * 100).toFixed(1) + "%";
  var word = rowdy < 0.2 ? "CALM" : rowdy < 0.45 ? "RESTLESS" : rowdy < 0.72 ? "ROWDY" : "FERAL";
  if(E["g-rowdy"].textContent !== word) E["g-rowdy"].textContent = word;
  E["gw-rowdy"].className = "gauge wide" + (rowdy >= 0.72 ? " warn" : (rowdy >= 0.2 ? " stir" : ""));

  /* One wobble per named step, each visibly worse than the one below it, so
     the gauge tells you which band you are in without reading the word. */
  var step = rowdy < 0.2 ? 0 : rowdy < 0.45 ? 1 : rowdy < 0.72 ? 2 : 3;
  var amp  = [0, 3.4, 9, 19][step], rot = [0, 1.1, 3.0, 6.2][step],
      frq  = [0, 3.2, 5.4, 8.1][step];
  E["gw-rowdy"].style.transform = step === 0 ? "none"
    : "translate(" + (Math.sin(tAcc*frq)*amp).toFixed(2) + "px," +
                     (Math.cos(tAcc*frq*0.78)*amp*0.6).toFixed(2) + "px) rotate(" +
                     (Math.sin(tAcc*frq*0.66)*rot).toFixed(2) + "deg)";

  /* what is stirring them up, right now, beside the gauge it is moving */
  var mphN = speed / upm(), limN = pSeg ? ZONES[pSeg.zone].limit : 55;
  E["ri-horn"].hidden  = !(running && honkT > 0);
  E["ri-speed"].hidden = !(running && mphN > limN + 1);
  E["ri-fan"].hidden   = !(running && acCharge <= 0);
  E["wild"].hidden     = !(running && rowdy > 0.62);

  /* the thirst sign, swimming the way the windscreen does */
  var th = E["thirsty"];
  th.hidden = !(running && dim > 0.03);
  if(!th.hidden){
    var sw = dim * P.woozyAmp;
    th.style.transform = "translate(" + (Math.sin(tAcc*0.61)*16*sw).toFixed(2) + "px," +
                         (Math.cos(tAcc*0.74)*10*sw).toFixed(2) + "px) rotate(" +
                         (Math.sin(tAcc*1.15)*2.4*sw).toFixed(2) + "deg) scale(" +
                         (1 + Math.sin(tAcc*0.83)*0.035*sw).toFixed(3) + ")";
  }
}

/* ---------------- cards ---------------- */
var card = document.getElementById("card"), sheet = document.getElementById("sheet");
function hideCard(){ card.hidden = true; }
function showCard(html, cls){
  sheet.className = "sheet" + (cls ? " " + cls : "");
  card.className = cls ? "c-" + cls : "";
  sheet.innerHTML = html; card.hidden = false;
}
function showStart(){
  showCard(
    '<div class="tt">' +
      '<b class="bus">BUS</b>' +
      '<i></i>' +
      '<b class="sub"><span class="m">S</span>U<span class="m">B</span></b>' +
    '</div>' +
    '<div class="tkeys">' +
      '<span>HOLD <b class="kc">\u2191</b> TO DRIVE</span>' +
      '<span>STEER WITH <b class="kc">\u2190</b> AND <b class="kc">\u2192</b></span>' +
      '<span>BRAKE WITH <b class="kc">\u2193</b></span>' +
    '</div>' +
    '<button id="go" class="tgo">HIT THE ROAD \u2014 TAP <b class="kc">SPACE</b></button>',
    "title"
  );
  var b = document.getElementById("go");
  if(b) b.onclick = startRun;
}
function startRun(){
  if(mode !== "start") return;
  mode = "drive"; running = true; hideCard();
  if(!audioBuilt) startBeds();
}

function gradeOf(r){
  return r>=0.93?"A":r>=0.86?"A−":r>=0.79?"B+":r>=0.71?"B":r>=0.63?"B−":
         r>=0.55?"C+":r>=0.46?"C":r>=0.38?"C−":r>=0.30?"D+":r>=0.20?"D":"F";
}
function remarkFor(o){
  if(o.pedHits >= 3)    return "Three separate parents watched you do this. They have a group chat.";
  if(o.headons)         return "Head-on. There is a form for this and you will be filling it in.";
  if(o.incident)        return "We will not be discussing this with the parents. Neither will you.";
  if(o.pedHits)         return "Somebody had to dive out of the way. A crossing guard took your plate.";
  if(o.redLights >= 2)  return "The lights in town are not decorative.";
  if(o.collisions >= 3) return "The district's insurer has been notified. Twice.";
  if(!o.made)           return "Never arrived. The children were returned by other means.";
  if(o.speeding >= 6)   return "The posted limits are posted for a reason. Several of them.";
  if(o.dimT > 45)       return "You drove most of this route lightheaded. Drink water.";
  if(o.late)            return "Arrived. Eventually. The 3:15 is called the 3:15 for a reason.";
  if(o.composure > 0.88)return "The children were unusually quiet. We have elected not to ask why.";
  if(o.total >= 1500)   return "Adequate. Do not let it go to your head.";
  if(o.composure < 0.45)return "Several parents described the noise as “industrial”.";
  return "Acceptable. The bus was returned in roughly its original condition.";
}

function finish(made){
  running = false; mode = "done";
  var composure = stat.total > 0 ? clamp(1 - stat.rowdy / stat.total, 0, 1) : 1;
  var margin = P.deadline - elapsed;
  var covered = finishZ > 0 ? Math.min(1, position / finishZ) : 0;
  var late = made && margin < 0;

  var punctR = made ? clamp(margin / P.deadline, 0, 1) : covered * 0.4;
  var punct  = Math.round(1000 * punctR);
  var comp   = Math.round(800 * composure);
  var safeR  = clamp(1 - (stat.pedHits * 0.4 + stat.redLights * 0.22), 0, 1);
  var safeP  = -450 * stat.pedHits - 400 * stat.redLights;
  var careR  = clamp(1 - (stat.collisions * 0.2 + stat.headons * 0.5 + stat.potholes * 0.04), 0, 1);
  var careP  = -300 * stat.collisions - 900 * stat.headons - 40 * stat.potholes;
  var spdR   = clamp(1 - stat.speeding / 12, 0, 1);
  var spdP   = -Math.round(45 * stat.speeding);
  var selfR  = incident ? 0 : clamp(1 - stat.dimT / 60, 0, 1);
  var selfP  = (incident ? -1200 : 0) - Math.round(8 * stat.dimT);
  var lateP  = (!made || late) ? -500 : 0;
  var total  = punct + comp + safeP + spdP + careP + selfP + lateP;

  var rank = total >= 1500 ? "PROMOTED" : total >= 1100 ? "ASKED BACK"
           : total >= 650  ? "NOTHING IN YOUR FILE" : total >= 150 ? "STILL A SUBSTITUTE"
           : "THEY'RE DISCUSSING YOU";
  var d = new Date(), MON = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

  function row(label, sub, grade, pts, neg){
    return '<tr' + (neg ? ' class="neg"' : '') + '><td class="c">' + label +
           '<small>' + sub + '</small></td><td class="g">' + grade + '</td>' +
           '<td class="n">' + (pts > 0 ? "+" : "") + pts + '</td></tr>';
  }
  var safeSub = stat.pedHits || stat.redLights
      ? [stat.pedHits ? stat.pedHits + " sent diving" : "",
         stat.redLights ? stat.redLights + " red light" + (stat.redLights>1?"s":"") : ""]
         .filter(Boolean).join(", ")
      : "nobody had to jump";
  var careSub = (stat.collisions || stat.headons || stat.potholes)
      ? [stat.collisions ? stat.collisions + " collision" + (stat.collisions>1?"s":"") : "",
         stat.headons ? stat.headons + " head-on" : "",
         stat.potholes ? stat.potholes + " pothole" + (stat.potholes>1?"s":"") : ""].filter(Boolean).join(", ")
      : "no contact";

  var rows =
    row("Punctuality", made ? ((margin>=0?"+":"") + margin.toFixed(1) + "s on the clock")
                            : ((covered*100).toFixed(0) + "% of the route"), gradeOf(punctR), punct, false) +
    row("Composure", (composure*100).toFixed(0) + "% of the run quiet", gradeOf(composure), comp, false) +
    row("Public safety", safeSub, gradeOf(safeR), safeP, safeP < 0) +
    row("Observance of limits", stat.speeding < 0.2 ? "within the posted limits"
        : (stat.speeding < 3 ? "over the limit here and there" : "consistently over the limit"),
        gradeOf(spdR), spdP, spdP < 0) +
    row("Vehicle care", careSub, gradeOf(careR), careP, careP < 0) +
    row("Personal conduct", incident ? "dignity not recovered"
        : (stat.dimT > 6 ? Math.round(stat.dimT) + "s driven lightheaded" : "held it together"),
        gradeOf(selfR), selfP, selfP < 0) +
    (lateP ? row("Arrival", made ? "past the deadline" : "did not arrive", "F", lateP, true) : "");

  var remark = remarkFor({ incident:incident, collisions:stat.collisions, headons:stat.headons,
                           dimT:stat.dimT, speeding:stat.speeding, pedHits:stat.pedHits,
                           redLights:stat.redLights, made:made, late:late,
                           composure:composure, total:total });

  showCard(
    '<div class="rc">' +
      '<div class="rc-hd">' +
        '<div class="rc-ttl">Substitute Driver Evaluation</div>' +
      '</div>' +
      '<div class="rc-meta">' +
        '<div><span>Route</span><b>No. 9</b></div>' +
        '<div><span>Vehicle</span><b>Bus 12 (reserve)</b></div>' +
        '<div><span>Date</span><b>' + d.getDate() + " " + MON[d.getMonth()] + '</b></div>' +
      '</div>' +
      '<table class="rc-tbl"><thead><tr><th>Criterion</th><th class="g">Mark</th><th class="n">Points</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<div class="rc-bot">' +
        '<div class="rc-tot"><span>Final</span><b>' + total + '</b></div>' +
        '<div class="rc-stamp">' + rank + '</div>' +
      '</div>' +
      '<div class="rc-rem"><span>Remarks</span><p>' + remark + '</p></div>' +
      '<div class="rc-act"><button id="again">I\u2019ll do better next time</button></div>' +
    '</div>', "paper");
  var b = document.getElementById("again");
  if(b) b.onclick = function(){ resetRun(true); };
}

/* ---------------- tuning panel ---------------- */
var stageEl = document.getElementById("stage"),
    panel = document.getElementById("panel"),
    controls = document.getElementById("controls");
function openPanel(){ panel.classList.add("open"); stageEl.classList.add("panelopen"); }
function closePanel(){
  panel.classList.remove("open"); stageEl.classList.remove("panelopen");
  /* otherwise a slider keeps keyboard focus and eats the arrow keys */
  if(document.activeElement && panel.contains(document.activeElement) &&
     document.activeElement.blur) document.activeElement.blur();
}
function togglePanel(){ panel.classList.contains("open") ? closePanel() : openPanel(); }
/* no visible tuning button - the clock opens the bench */
E["clock"].onclick = togglePanel;
document.getElementById("panelclose").onclick = closePanel;
document.getElementById("btn-close").onclick = function(){
  closePanel();
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
};
function fmtVal(p){
  var v = P[p.k];
  return ((p.step < 1) ? v.toFixed(2) : String(Math.round(v))) + p.u;
}
function buildPanel(){
  var html = "";
  PARAMS.forEach(function(p){
    if(p.g){ html += '<div class="grp">' + p.g + '</div>'; return; }
    html += '<div class="row' + (p.rebuild ? ' rebuild' : '') + '">' +
      '<label class="lab" for="p-' + p.k + '"><span>' + p.n + '</span><b id="v-' + p.k + '">' + fmtVal(p) + '</b></label>' +
      '<input id="p-' + p.k + '" type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + P[p.k] + '">' +
      '</div>';
  });
  controls.innerHTML = html;
  PARAMS.forEach(function(p){
    if(!p.k) return;
    var inp = document.getElementById("p-" + p.k), out = document.getElementById("v-" + p.k);
    inp.addEventListener("input", function(){
      P[p.k] = parseFloat(inp.value);
      out.textContent = fmtVal(p);
      persist();
      if(p.rebuild) resetRun(true);
    });
  });
}
function syncPanel(){
  PARAMS.forEach(function(p){
    if(!p.k) return;
    var inp = document.getElementById("p-" + p.k), out = document.getElementById("v-" + p.k);
    if(inp){ inp.value = P[p.k]; out.textContent = fmtVal(p); }
  });
}
document.getElementById("btn-restart").onclick = function(){ resetRun(true); };
document.getElementById("btn-reset").onclick = function(){
  PARAMS.forEach(function(p){ if(p.k) P[p.k] = p.d; });
  persist(); syncPanel(); resetRun(true);
};
document.getElementById("btn-copy").onclick = function(){
  var out = {};
  PARAMS.forEach(function(p){ if(p.k) out[p.k] = P[p.k]; });
  var txt = JSON.stringify(out, null, 2);
  var ta = document.getElementById("dump");
  ta.hidden = false; ta.value = txt; ta.select();
  try{ if(navigator.clipboard) navigator.clipboard.writeText(txt); }catch(e){}
};

/* ---------------- loop ---------------- */
var last = 0;
function frame(ts){
  if(!last) last = ts;
  var dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  tAcc += dt;
  update(dt); render(); hud(); tickBanners(dt);
  requestAnimationFrame(frame);
}
function boot(){
  fkEl = document.getElementById("fork");
  fkL = document.getElementById("fk-l"); fkR = document.getElementById("fk-r");
  loadColors(); resize(); buildPanel(); resetRun(true);
  requestAnimationFrame(frame);
}
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(boot).catch(boot); }
else { boot(); }

})();
</script>
